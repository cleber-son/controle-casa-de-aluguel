services:
  controle-aluguel:
    container_name: controle-casa-de-aluguel
    build: .
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    working_dir: /app
    volumes:
      # Banco SQLite + sessões persistem entre restarts
      - ./data:/app/data
    networks:
      - default
      - painel
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
  painel:
    # Mesmo network externo do projeto Hook (onde o Caddy roda).
    # Se o nome for diferente na sua VPS, ajuste aqui.
    name: painel-hook_painel
    external: true
