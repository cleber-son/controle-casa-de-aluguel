<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <script>/* tema antes da pintura, evita piscar */(function(){try{var t=localStorage.getItem('quintal.tema');if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro';}document.documentElement.setAttribute('data-theme',t==='claro'?'light':'dark');if(t==='claro'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#ffffff');}}catch(e){}})();</script>
  <title>Quintal — Casas</title>
  <link rel="stylesheet" href="/css/app.css?v=3.10">
  <style>
    /* regras específicas desta página — tudo com os tokens do design system */
    /* 2 colunas só quando cabe de verdade: cada card tem um formulário inteiro dentro */
    .casas-lista { display:grid; gap:var(--gap); grid-template-columns:1fr }
    .casas-lista > .card + .card { margin-top:0 }
    @media (min-width:1040px) { .casas-lista { grid-template-columns:repeat(2,minmax(0,1fr)) } }
    .avisos { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px }
    .avisos:empty { display:none }
    .dirty-tag { display:none }
    .is-dirty .dirty-tag { display:inline-flex }
    .is-dirty { outline:1px solid var(--warn); outline-offset:0 }
    .casa-num { font-variant-numeric:tabular-nums }
    .rel-item { display:flex; justify-content:space-between; gap:12px; align-items:baseline;
                padding:8px 0; border-bottom:1px solid var(--line) }
    .rel-item:last-child { border-bottom:0 }
    .sem-tel-lista { margin:8px 0 0; padding-left:18px }
    .sem-tel-lista li { margin:2px 0 }
    .sk-line { height:14px; border-radius:var(--r-sm); margin:10px 0 }
    .sk-line.lg { height:24px; width:45% }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="container" id="app">
    <div class="stack">
      <div class="row wrap">
        <div class="col">
          <h1 class="card-title">Casas do quintal</h1>
          <p class="muted small">Este cadastro alimenta todo o resto do sistema: é daqui que saem o
            aluguel de cada mês, as cabeças que dividem a água, o relógio de luz e o telefone do WhatsApp.</p>
        </div>
        <div class="right">
          <button class="btn btn-outline" id="btn-nova" type="button">+ Adicionar casa</button>
        </div>
      </div>

      <div id="resumo"></div>
      <div id="lista" class="stack"></div>
    </div>
  </main>

  <script src="/js/core.js?v=3.10"></script>
  <script>
  (function () {
    App.mount('casas');

    var elResumo = document.getElementById('resumo');
    var elLista  = document.getElementById('lista');

    var state = { casas: [], form: {}, nova: null, carregando: true };

    /* ---------- helpers ---------- */

    function digitos(s) { return String(s == null ? '' : s).replace(/\D+/g, ''); }

    // '5511987654321' -> '(11) 98765-4321' (o 55 é implícito na tela)
    function mascaraTel(d) {
      d = digitos(d).slice(0, 11);
      if (!d) return '';
      if (d.length <= 2) return '(' + d;
      if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
      if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
      return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
    }
    function telParaInput(tel) {
      var d = digitos(tel);
      if (d.indexOf('55') === 0 && d.length > 11) d = d.slice(2);
      return mascaraTel(d);
    }
    // o backend guarda só dígitos, com DDI: 55 + DDD + número
    function telParaApi(v) {
      var d = digitos(v);
      if (!d) return null;
      if (d.length === 10 || d.length === 11) return '55' + d;
      return d;
    }
    function telValido(v) {
      var d = digitos(v);
      return d.length === 0 || d.length === 10 || d.length === 11;
    }

    function moedaNum(v) {
      if (typeof v === 'number') return v;
      var s = String(v == null ? '' : v).trim().replace(/[^\d.,-]/g, '');
      if (!s) return 0;
      if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
      var n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }
    function numStr(n) {
      if (n === null || n === undefined || n === '') return '';
      return String(n).replace('.', ',');
    }
    function casaStr(n) { n = parseInt(n, 10); return (isNaN(n) ? '?' : (n < 10 ? '0' + n : '' + n)); }
    function esc(s) { return App.escapeHtml(s == null ? '' : String(s)); }

    /* ---------- buffer de edição ---------- */

    function campos(c) {
      return {
        numero:      c.numero == null ? '' : String(c.numero),
        inquilino:   c.inquilino || '',
        inquilino_desde: c.inquilino_desde || '',
        telefone:    telParaInput(c.telefone),
        aluguel:     numStr(c.aluguel == null ? 0 : c.aluguel),
        moradores:   String(c.moradores == null ? 1 : c.moradores),
        relogio:     String(c.relogio == null ? 1 : c.relogio),
        peso_luz:    numStr(c.peso_luz == null ? 1 : c.peso_luz),
        ativa:       (c.ativa === undefined || c.ativa) ? 1 : 0,
        observacoes: c.observacoes || ''
      };
    }
    function chave(id) { return id === null ? 'nova' : String(id); }
    function buffer(id) { return state.form[chave(id)]; }
    function original(id) {
      if (id === null) return campos({ inquilino: '', inquilino_desde: '', aluguel: 0, moradores: 1, relogio: 1, peso_luz: 1, ativa: 1, numero: state.nova ? state.nova.numero : '' });
      for (var i = 0; i < state.casas.length; i++) if (state.casas[i].id === id) return campos(state.casas[i]);
      return null;
    }
    function sujo(id) {
      var o = original(id), f = buffer(id);
      if (!o || !f) return false;
      return JSON.stringify(o) !== JSON.stringify(f);
    }

    /* ---------- carregar ---------- */

    function skeleton() {
      var h = '';
      for (var i = 0; i < 4; i++) {
        h += '<section class="card"><div class="card-body">' +
             '<div class="skeleton sk-line lg"></div>' +
             '<div class="skeleton sk-line"></div>' +
             '<div class="skeleton sk-line"></div>' +
             '<div class="skeleton sk-line"></div>' +
             '</div></section>';
      }
      elResumo.innerHTML = '<section class="card"><div class="card-body"><div class="skeleton sk-line lg"></div><div class="skeleton sk-line"></div></div></section>';
      elLista.innerHTML = '<div class="casas-lista">' + h + '</div>';
    }

    function carregar() {
      state.carregando = true;
      skeleton();
      App.api('/casas').then(function (r) {
        var lista = Array.isArray(r) ? r : (r && r.casas) || [];
        lista.sort(function (a, b) { return (a.numero || 0) - (b.numero || 0); });
        state.casas = lista;
        state.form = {};
        for (var i = 0; i < lista.length; i++) state.form[chave(lista[i].id)] = campos(lista[i]);
        if (state.nova) state.form.nova = state.form.nova || campos(state.nova);
        state.carregando = false;
        render();
      }).catch(function () {
        state.carregando = false;
        elResumo.innerHTML = '';
        elLista.innerHTML =
          '<div class="empty"><div class="empty-icon">⚠️</div>' +
          '<p class="strong">Não foi possível carregar as casas.</p>' +
          '<p class="muted small">Verifique a conexão com o servidor e tente de novo.</p>' +
          '<button class="btn btn-primary" data-acao="recarregar" type="button">Tentar de novo</button></div>';
      });
    }

    /* ---------- resumo ---------- */

    function renderResumo() {
      var ativas = state.casas.filter(function (c) { return c.ativa; });
      var ocupadas = ativas.filter(function (c) { return (c.inquilino || '').trim() !== ''; });
      var vagas = ativas.length - ocupadas.length;
      var moradores = ocupadas.reduce(function (s, c) { return s + (Number(c.moradores) || 0); }, 0);
      var aluguel = ocupadas.reduce(function (s, c) { return s + (Number(c.aluguel) || 0); }, 0);
      var semTel = ocupadas.filter(function (c) { return !digitos(c.telefone); });

      var numsRel = Object.keys(relogiosExistentes()).map(Number).sort(function (a, b) { return a - b; });
      var rel = numsRel.map(function (r) {
        var doRel = ativas.filter(function (c) { return Number(c.relogio) === r; });
        var oc = doRel.filter(function (c) { return (c.inquilino || '').trim() !== ''; });
        return {
          relogio: r,
          casas: doRel.map(function (c) { return casaStr(c.numero); }).join(', ') || '—',
          ocupadas: oc.length,
          moradores: oc.reduce(function (s, c) { return s + (Number(c.moradores) || 0); }, 0),
          peso: oc.reduce(function (s, c) { return s + (Number(c.peso_luz) || 0); }, 0)
        };
      });
      var semRelogio = ativas.filter(function (c) { return !(Number(c.relogio) >= 1); });

      var h = '';

      h += '<section class="card card-accent-brand">' +
           '<div class="card-head"><div>' +
           '<div class="card-title">Resumo do cadastro</div>' +
           '<div class="card-sub">Considera apenas o que já está salvo.</div>' +
           '</div></div>';

      h += '<div class="card-body"><div class="stat-row">' +
           stat('Casas ativas', ativas.length, ocupadas.length + ' ocupada(s) · ' + vagas + ' vaga(s)') +
           stat('Moradores (cabeças)', moradores, 'É este número que divide a conta de água') +
           stat('Aluguel dos ocupados', App.money(aluguel), 'Soma do aluguel cadastrado das casas ocupadas') +
           stat('Sem telefone', semTel.length, semTel.length ? 'Não recebem WhatsApp' : 'Todas as ocupadas têm telefone') +
           '</div>';

      h += '<div class="stack" style="margin-top:14px">';
      h += '<div class="card-sub strong">Relógios de luz</div>';
      rel.forEach(function (r) {
        h += '<div class="rel-item"><div><span class="badge badge-luz">Relógio ' + r.relogio + '</span> ' +
             '<span class="small muted">casas ' + esc(r.casas) + '</span></div>' +
             '<div class="small">' + r.ocupadas + ' ocupada(s) · ' + r.moradores + ' morador(es) · peso total ' +
             App.num(r.peso) + '</div></div>';
      });
      if (semRelogio.length) {
        h += '<div class="badge badge-err">Há casa(s) sem relógio válido: ' +
             esc(semRelogio.map(function (c) { return casaStr(c.numero); }).join(', ')) + '</div>';
      }
      h += '<p class="muted small">A luz é dividida dentro de cada relógio pelo <span class="strong">peso</span> das casas ocupadas ' +
           '(peso 1 em todas = divisão igual). Casa sozinha no relógio paga a conta inteira dele. ' +
           'Já a água é dividida por cabeça, somando os moradores de <span class="strong">todas</span> as casas ocupadas, ' +
           'independente do relógio.</p>';
      h += '</div>';

      if (semTel.length) {
        h += '<div class="stack" style="margin-top:14px">' +
             '<div class="badge badge-warn">Sem telefone: ' + semTel.length + ' casa(s) ocupada(s)</div>' +
             '<ul class="sem-tel-lista small muted">' +
             semTel.map(function (c) { return '<li>Casa ' + casaStr(c.numero) + ' — ' + esc(c.inquilino) + '</li>'; }).join('') +
             '</ul>' +
             '<p class="muted small">Os telefones começam vazios. Enquanto não forem preenchidos, ' +
             'a tela de WhatsApp não consegue abrir a conversa dessas casas (só dá pra copiar o texto).</p>' +
             '</div>';
      }

      h += '</div></section>';
      elResumo.innerHTML = h;
    }

    function stat(label, valor, hint) {
      return '<div class="stat"><div class="stat-label">' + esc(label) + '</div>' +
             '<div class="stat-value">' + esc(valor) + '</div>' +
             (hint ? '<div class="stat-hint">' + esc(hint) + '</div>' : '') + '</div>';
    }

    /* ---------- avisos por casa ---------- */

    function avisosHtml(id) {
      var f = buffer(id); if (!f) return '';
      var b = [];
      var vaga = f.inquilino.trim() === '';
      if (!f.ativa) b.push('<span class="badge badge-dim">Inativa — não entra nos próximos meses</span>');
      if (vaga) b.push('<span class="badge badge-info">Casa vaga — não paga água, luz nem aluguel</span>');
      if (!vaga && (f.inquilino_desde || '').trim()) {
        b.push('<span class="badge badge-info">Entrou em ' + esc(f.inquilino_desde) + ' — meses antes disso ficam vagos</span>');
      }
      if (!vaga && !digitos(f.telefone)) b.push('<span class="badge badge-warn">Sem telefone — não dá pra mandar WhatsApp</span>');
      if (digitos(f.telefone) && !telValido(f.telefone)) b.push('<span class="badge badge-err">Telefone incompleto</span>');
      if (!vaga && (parseInt(f.moradores, 10) || 0) < 1) b.push('<span class="badge badge-warn">Sem moradores — não entra no rateio da água</span>');
      if (moedaNum(f.peso_luz) <= 0) b.push('<span class="badge badge-warn">Peso da luz zerado</span>');
      return b.join('');
    }

    /* ---------- card da casa ---------- */

    function cardCasa(c, nova) {
      var id = nova ? null : c.id;
      var k = chave(id);
      var f = buffer(id);
      var num = f.numero || (c.numero || '');
      var vaga = f.inquilino.trim() === '';

      var acento = nova ? 'card-accent-brand' : (f.ativa ? (vaga ? '' : 'card-accent-aluguel') : '');

      var h = '<section class="card ' + acento + '" data-casa="' + k + '">';

      h += '<div class="card-head"><div>' +
           '<div class="card-title casa-num">' + (nova ? 'Nova casa' : 'Casa ' + casaStr(num)) + '</div>' +
           '<div class="card-sub" data-sub="' + k + '">' + (vaga ? 'Vaga' : esc(f.inquilino)) + '</div>' +
           '</div><div class="right">' +
           '<span class="badge badge-warn dirty-tag">alterações não salvas</span>' +
           '</div></div>';

      h += '<div class="card-body">';
      h += '<div class="avisos" data-avisos="' + k + '">' + avisosHtml(id) + '</div>';

      h += '<div class="form-grid">';

      h += campoNum(k, 'numero', 'Número da casa', f.numero, '1', 'Identifica a casa no quintal.');

      h += '<div class="field"><label class="field-label" for="inq-' + k + '">Inquilino</label>' +
           '<input class="input" id="inq-' + k + '" type="text" autocomplete="off" data-casa="' + k + '" data-campo="inquilino" ' +
           'value="' + esc(f.inquilino) + '" placeholder="Nome de quem mora">' +
           '<div class="field-hint">Deixe <span class="strong">vazio</span> se a casa está vaga.</div></div>';

      h += '<div class="field"><label class="field-label" for="desde-' + k + '">Inquilino desde</label>' +
           '<input class="input" id="desde-' + k + '" type="month" data-casa="' + k + '" data-campo="inquilino_desde" ' +
           'value="' + esc(f.inquilino_desde) + '">' +
           '<div class="field-hint">Mês em que ele entrou. Meses <span class="strong">anteriores</span> a esse ' +
           'ficam como casa vaga: ele não é cobrado e não entra no rateio de água e luz. Deixe em branco se ' +
           'ele já estava aqui desde o começo do controle.</div></div>';

      h += '<div class="field"><label class="field-label" for="tel-' + k + '">Telefone (WhatsApp)</label>' +
           '<input class="input" id="tel-' + k + '" type="tel" inputmode="numeric" autocomplete="off" data-casa="' + k + '" data-campo="telefone" ' +
           'value="' + esc(f.telefone) + '" placeholder="(11) 98765-4321" maxlength="16">' +
           '<div class="field-hint">Começa vazio. Sem telefone, a tela de WhatsApp não abre a conversa desta casa.</div></div>';

      h += '<div class="field"><label class="field-label" for="alu-' + k + '">Aluguel</label>' +
           '<div class="input-money"><input class="input" id="alu-' + k + '" type="text" inputmode="decimal" data-casa="' + k + '" data-campo="aluguel" ' +
           'value="' + esc(f.aluguel) + '" placeholder="350,00"></div>' +
           '<div class="field-hint">Valor padrão. Ao criar um mês novo ele é copiado e pode ser ajustado lá.</div></div>';

      h += '<div class="field"><label class="field-label" for="mor-' + k + '">Moradores (cabeças)</label>' +
           '<input class="input" id="mor-' + k + '" type="number" min="0" step="1" inputmode="numeric" data-casa="' + k + '" data-campo="moradores" ' +
           'value="' + esc(f.moradores) + '">' +
           '<div class="field-hint">Quantas pessoas moram aqui. <span class="strong">É este número que rateia a conta de água</span> ' +
           '(água total ÷ total de moradores × moradores da casa).</div></div>';

      h += '<div class="field"><label class="field-label" for="rel-' + k + '">Relógio de luz</label>' +
           '<select class="select" id="rel-' + k + '" data-casa="' + k + '" data-campo="relogio">' +
           opcoesRelogio(f.relogio) +
           '</select>' +
           '<div class="field-hint">Cada relógio é uma conta de luz separada, dividida entre as casas ' +
           'ocupadas dele. Casa com relógio só dela paga a conta inteira.</div></div>';

      h += '<div class="field"><label class="field-label" for="pes-' + k + '">Peso da luz</label>' +
           '<input class="input" id="pes-' + k + '" type="text" inputmode="decimal" data-casa="' + k + '" data-campo="peso_luz" ' +
           'value="' + esc(f.peso_luz) + '" placeholder="1">' +
           '<div class="field-hint">1 = divide igual com as outras casas do relógio. Use 2 se esta casa gasta o dobro.</div></div>';

      h += '<div class="field"><span class="field-label">Situação</span>' +
           '<label class="switch"><input type="checkbox" data-casa="' + k + '" data-campo="ativa"' + (f.ativa ? ' checked' : '') + '>' +
           '<span>Casa ativa</span></label>' +
           '<div class="field-hint">Casa inativa deixa de aparecer nos meses novos (o histórico continua).</div></div>';

      h += '<div class="field"><label class="field-label" for="obs-' + k + '">Observações</label>' +
           '<textarea class="textarea" id="obs-' + k + '" rows="2" data-casa="' + k + '" data-campo="observacoes" ' +
           'placeholder="Ex.: estoque, casa dos fundos...">' + esc(f.observacoes) + '</textarea></div>';

      h += '</div></div>';

      h += '<div class="card-foot">' +
           '<button class="btn btn-primary" type="button" data-acao="salvar" data-casa="' + k + '">' +
           (nova ? 'Criar casa' : 'Salvar') + '</button>' +
           (nova
             ? '<button class="btn btn-ghost" type="button" data-acao="cancelar-nova">Cancelar</button>'
             : '<button class="btn btn-ghost" type="button" data-acao="desfazer" data-casa="' + k + '">Desfazer</button>' +
               '<span class="spacer"></span>' +
               '<button class="btn btn-danger btn-sm" type="button" data-acao="remover" data-casa="' + k + '">Remover</button>') +
           '</div>';

      h += '</section>';
      return h;
    }

    /* Relógios não são fixos: a lista sai do próprio cadastro, e sempre sobra
       uma opção a mais para quem precisa de um relógio novo (conta separada). */
    function relogiosExistentes() {
      var vistos = {};
      state.casas.forEach(function (c) {
        var r = parseInt(c.relogio, 10);
        if (r >= 1) vistos[r] = (vistos[r] || []).concat(casaStr(c.numero));
      });
      return vistos;
    }

    function opcoesRelogio(atual) {
      var vistos = relogiosExistentes();
      var nums = Object.keys(vistos).map(Number).sort(function (a, b) { return a - b; });
      var sel = parseInt(atual, 10) || 1;
      if (nums.indexOf(sel) === -1) nums.push(sel);
      nums.sort(function (a, b) { return a - b; });
      var novo = (nums.length ? Math.max.apply(null, nums) : 0) + 1;

      var h = nums.map(function (r) {
        var casas = (vistos[r] || []).join(', ');
        return '<option value="' + r + '"' + (sel === r ? ' selected' : '') + '>Relógio ' + r +
               (casas ? ' — casas ' + esc(casas) : ' — sem casas ainda') + '</option>';
      }).join('');
      h += '<option value="' + novo + '"' + (sel === novo ? ' selected' : '') + '>Relógio ' + novo +
           ' — novo (conta separada)</option>';
      return h;
    }

    function campoNum(k, campo, label, valor, ph, hint) {
      return '<div class="field"><label class="field-label" for="' + campo + '-' + k + '">' + esc(label) + '</label>' +
             '<input class="input" id="' + campo + '-' + k + '" type="number" min="1" step="1" inputmode="numeric" ' +
             'data-casa="' + k + '" data-campo="' + campo + '" value="' + esc(valor) + '" placeholder="' + esc(ph) + '">' +
             (hint ? '<div class="field-hint">' + esc(hint) + '</div>' : '') + '</div>';
    }

    /* ---------- render ---------- */

    function render() {
      renderResumo();

      if (!state.casas.length && !state.nova) {
        elLista.innerHTML = '<div class="empty"><div class="empty-icon">🏠</div>' +
          '<p class="strong">Nenhuma casa cadastrada.</p>' +
          '<p class="muted small">Adicione a primeira casa para começar.</p>' +
          '<button class="btn btn-primary" type="button" data-acao="nova">+ Adicionar casa</button></div>';
        return;
      }

      var h = '<div class="casas-lista">';
      state.casas.forEach(function (c) { h += cardCasa(c, false); });
      if (state.nova) h += cardCasa(state.nova, true);
      h += '</div>';
      elLista.innerHTML = h;

      // marca cards com alterações pendentes (ex.: depois de um erro de salvamento)
      state.casas.forEach(function (c) { marcarSujo(c.id); });
      if (state.nova) marcarSujo(null);
    }

    function cardEl(k) { return document.querySelector('[data-casa="' + k + '"].card'); }

    function marcarSujo(id) {
      var el = cardEl(chave(id));
      if (!el) return;
      el.classList.toggle('is-dirty', id === null ? true : sujo(id));
    }

    function atualizarCard(id) {
      var k = chave(id), f = buffer(id);
      var av = document.querySelector('[data-avisos="' + k + '"]');
      if (av) av.innerHTML = avisosHtml(id);
      var sub = document.querySelector('[data-sub="' + k + '"]');
      if (sub) sub.textContent = f.inquilino.trim() === '' ? 'Vaga' : f.inquilino;
      marcarSujo(id);
    }

    /* ---------- eventos ---------- */

    document.addEventListener('input', function (e) {
      var el = e.target.closest('[data-campo]');
      if (!el) return;
      var k = el.getAttribute('data-casa');
      var campo = el.getAttribute('data-campo');
      var f = state.form[k];
      if (!f) return;

      if (campo === 'telefone') {
        var pos = el.selectionStart, antes = el.value.length;
        el.value = mascaraTel(el.value);
        if (pos !== null && pos < antes) el.setSelectionRange(pos + (el.value.length - antes), pos + (el.value.length - antes));
        f.telefone = el.value;
      } else if (campo === 'ativa') {
        f.ativa = el.checked ? 1 : 0;
      } else {
        f[campo] = el.value;
      }
      atualizarCard(k === 'nova' ? null : parseInt(k, 10));
    });

    document.addEventListener('change', function (e) {
      var el = e.target.closest('[data-campo]');
      if (!el) return;
      var k = el.getAttribute('data-casa');
      var campo = el.getAttribute('data-campo');
      var f = state.form[k];
      if (!f) return;
      if (campo === 'ativa') f.ativa = el.checked ? 1 : 0;
      else if (campo !== 'telefone') f[campo] = el.value;
      atualizarCard(k === 'nova' ? null : parseInt(k, 10));
    });

    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-acao]');
      if (!btn) return;
      var acao = btn.getAttribute('data-acao');
      var k = btn.getAttribute('data-casa');
      var id = (k && k !== 'nova') ? parseInt(k, 10) : null;

      if (acao === 'recarregar') return carregar();
      if (acao === 'nova') return novaCasa();
      if (acao === 'cancelar-nova') { state.nova = null; delete state.form.nova; return render(); }
      if (acao === 'desfazer') {
        state.form[k] = original(id);
        return render();
      }
      if (acao === 'salvar') return salvar(id, btn);
      if (acao === 'remover') return remover(id);
    });

    document.getElementById('btn-nova').addEventListener('click', novaCasa);

    /* ---------- ações ---------- */

    function novaCasa() {
      if (state.nova) {
        var el = cardEl('nova');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      var max = state.casas.reduce(function (m, c) { return Math.max(m, Number(c.numero) || 0); }, 0);
      var relMax = state.casas.reduce(function (m2, c) { return Math.max(m2, Number(c.relogio) || 0); }, 0);
      state.nova = { numero: max + 1, inquilino: '', inquilino_desde: '', telefone: '', aluguel: 0, moradores: 1,
                     relogio: relMax || 1, peso_luz: 1, ativa: 1, observacoes: '' };
      state.form.nova = campos(state.nova);
      render();
      var novo = cardEl('nova');
      if (novo) novo.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function validar(f) {
      var numero = parseInt(f.numero, 10);
      if (!numero || numero < 1) return 'Informe o número da casa.';
      if (!telValido(f.telefone)) return 'Telefone incompleto: use DDD + número (10 ou 11 dígitos).';
      var mor = parseInt(f.moradores, 10);
      if (isNaN(mor) || mor < 0) return 'Moradores não pode ser negativo.';
      if (moedaNum(f.aluguel) < 0) return 'Aluguel não pode ser negativo.';
      if (moedaNum(f.peso_luz) < 0) return 'Peso da luz não pode ser negativo.';
      var rel = parseInt(f.relogio, 10);
      if (!rel || rel < 1) return 'Escolha um relógio de luz válido.';
      return null;
    }

    function payload(f) {
      return {
        numero: parseInt(f.numero, 10),
        inquilino: f.inquilino.trim(),
        inquilino_desde: (f.inquilino_desde || '').trim() || null,
        telefone: telParaApi(f.telefone),
        aluguel: moedaNum(f.aluguel),
        moradores: parseInt(f.moradores, 10) || 0,
        relogio: parseInt(f.relogio, 10),
        peso_luz: moedaNum(f.peso_luz),
        ativa: f.ativa ? 1 : 0,
        observacoes: f.observacoes.trim()
      };
    }

    function salvar(id, btn) {
      var f = buffer(id);
      if (!f) return;
      var erro = validar(f);
      if (erro) { App.toast(erro, 'err'); return; }

      var body = payload(f);
      btn.disabled = true;
      var antes = btn.textContent;
      btn.textContent = 'Salvando...';

      var req = (id === null)
        ? App.api('/casas', { method: 'POST', body: body })
        : App.api('/casas/' + id, { method: 'PUT', body: body });

      req.then(function (r) {
        if (id === null) { state.nova = null; delete state.form.nova; }
        var n = (r && r.meses_sincronizados) || 0;
        App.toast(id === null
          ? 'Casa criada.'
          : 'Casa ' + casaStr(body.numero) + ' salva.' +
            (n ? ' Aplicado em ' + n + ' mês(es) em aberto.' : ''), 'ok');
        carregar();
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = antes;
      });
    }

    function remover(id) {
      var c = null;
      for (var i = 0; i < state.casas.length; i++) if (state.casas[i].id === id) c = state.casas[i];
      if (!c) return;
      App.confirmar({
        titulo: 'Remover casa ' + casaStr(c.numero) + '?',
        texto: 'Se esta casa já tiver lançamentos em algum mês, ela não é apagada: fica apenas desativada, ' +
               'para o histórico continuar íntegro.',
        ok: 'Remover',
        cancelar: 'Cancelar',
        perigo: true
      }).then(function (ok) {
        if (!ok) return;
        return App.api('/casas/' + id, { method: 'DELETE' }).then(function (r) {
          App.toast(r && r.desativada ? 'Casa desativada (tem histórico).' : 'Casa removida.', 'ok');
          carregar();
        });
      }).catch(function () { /* erro já sinalizado pelo App.api */ });
    }

    // evita perder edição sem querer ao sair da página
    window.addEventListener('beforeunload', function (e) {
      var pendente = state.casas.some(function (c) { return sujo(c.id); }) || (!!state.nova && sujo(null));
      if (pendente) { e.preventDefault(); e.returnValue = ''; }
    });

    carregar();
  })();
  </script>
</body>
</html>
