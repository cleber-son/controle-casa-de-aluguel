<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <script>/* tema antes da pintura, evita piscar */(function(){try{var t=localStorage.getItem('quintal.tema');if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro';}document.documentElement.setAttribute('data-theme',t==='claro'?'light':'dark');if(t==='claro'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#ffffff');}}catch(e){}})();</script>
  <title>Quintal — Mês</title>
  <link rel="stylesheet" href="/css/app.css?v=3.12">
  <style>
    /* Regras específicas da tela de Mês (usam os tokens do app.css) */
    .m-tit{font-size:1.25rem;line-height:1.2;margin:0;font-weight:800;letter-spacing:.3px}
    .m-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .m-sec-tit{font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
      color:var(--txt-mute);margin:2px 0 0}

    /* Lançamento das contas: bloco destacado, logo abaixo das abas de mês.
       Uma linha por conta — rótulo, valor, vencimento e o rateio calculado. */
    .m-lanc{border:1px solid var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
    .m-lanc-head{cursor:pointer;user-select:none}
    .m-lanc-seta{margin-left:auto;color:var(--txt-mute);transition:transform var(--t);font-size:.85rem}
    .m-lanc.is-aberto .m-lanc-seta{transform:rotate(180deg)}
    .m-lanc:not(.is-aberto) .card-body,
    .m-lanc:not(.is-aberto) .card-foot{display:none}
    .m-lanc .card-body{padding:12px 15px}

    .ml-linha{display:grid;grid-template-columns:112px minmax(96px,1fr) 150px;
      align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
    .ml-linha:first-child{border-top:0}
    .ml-rot{display:flex;align-items:center;gap:7px;min-width:0;font-weight:700;font-size:.9rem}
    .ml-rot .ml-pt{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
    .ml-pt-agua{background:var(--agua)}
    .ml-pt-luz{background:var(--luz)}
    .ml-pt-aluguel{background:var(--aluguel)}
    .ml-hint{grid-column:2/-1;font-size:.76rem;color:var(--txt-mute);margin-top:-4px;
      font-variant-numeric:tabular-nums}
    .ml-linha .input{min-height:42px}
    .m-lanc .card-foot{padding:12px 15px}

    @media (max-width:620px){
      .ml-linha{grid-template-columns:1fr 140px;gap:8px}
      .ml-rot{grid-column:1/-1}
      .ml-hint{grid-column:1/-1;margin-top:0}
    }

    /* ---- tabela das casas ----
       Uma linha por casa, uma coluna por conta. Cada célula cobrável é um
       <label> com checkbox: clicar em qualquer ponto dela marca/desmarca o
       pagamento. No celular a tabela vira cartões (.table-cards do app.css). */
    .mt{font-size:.94rem}
    .mt th{white-space:nowrap}
    .mt .th-agua{color:var(--agua)}
    .mt .th-luz{color:var(--luz)}
    .mt .th-outros{color:var(--outros)}
    .mt .th-aluguel{color:var(--aluguel)}

    .mt-casa{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .mt-sub{font-size:.76rem;color:var(--txt-dim);margin-top:2px}
    .mt td{vertical-align:middle}
    .mt .td-item{text-align:right;padding-top:6px;padding-bottom:6px}

    .mt-cel{display:inline-flex;align-items:center;justify-content:flex-end;gap:9px;
      min-height:40px;min-width:118px;padding:6px 10px;margin:0;cursor:pointer;
      border:1px solid transparent;border-radius:var(--r-sm);
      transition:background var(--t),border-color var(--t)}
    .mt-cel:hover{background:var(--card-3);border-color:var(--line)}
    .mt-cel input[type="checkbox"]{width:19px;height:19px;flex:0 0 19px;margin:0;
      accent-color:var(--brand);cursor:pointer}
    .mt-val{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
    .mt-cel.is-pago{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.32)}
    .mt-cel.is-pago .mt-val{color:var(--ok)}
    .mt-cel.is-zero{opacity:.4;cursor:default;min-width:0}
    .mt-cel.is-zero:hover{background:transparent;border-color:transparent}
    .mt-cel.is-bloq{cursor:default}
    .mt-cel.is-atrasado{border-color:var(--err)}

    /* "outros" sem valor: botão de lançar cobrança avulsa */
    .mt-add{display:inline-flex;align-items:center;justify-content:center;min-height:36px;
      padding:4px 12px;border:1px dashed var(--line);border-radius:var(--r-sm);
      background:transparent;color:var(--txt-mute);cursor:pointer;font-size:.84rem;font-weight:600}
    .mt-add:hover{color:var(--outros);border-color:var(--outros)}

    .mt-aberto{text-align:right;font-variant-numeric:tabular-nums;line-height:1.5}
    .mt-aberto .mt-l{font-size:.74rem;color:var(--txt-mute)}
    .mt tr.is-vaga td{opacity:.5}
    .mt tr.is-quitada{background:rgba(34,197,139,.05)}
    .mt .td-acoes{white-space:nowrap}
    .mt-edit-td{padding:0 !important;background:var(--bg-2)}

    /* no modo cartão (celular) a célula ocupa a linha inteira */
    @media (max-width:900px){
      .mt-cel{width:100%;justify-content:space-between;min-width:0}
      .mt-add{width:100%}
      .mt-aberto{text-align:right}
    }

    .m-edit{border-top:1px dashed var(--line);padding:16px 18px}

    .m-tab-novo{font-weight:800;font-size:1.15rem;min-width:44px}

    .m-sk{height:76px;border-radius:var(--r)}
    .m-sk-alto{height:180px;border-radius:var(--r)}
    .m-acoes{display:flex;gap:10px;flex-wrap:wrap}
    .m-acoes .btn{flex:1 1 170px}

    @media (max-width:430px){
      .mc-itens{grid-template-columns:1fr}
      .mc-nome,.mc-tot{font-size:1.1rem}
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="container" id="app">
    <section id="tabs" class="stack" aria-label="Meses"></section>
    <section id="conteudo" class="stack">
      <div class="skeleton m-sk"></div>
      <div class="skeleton m-sk-alto"></div>
      <div class="skeleton m-sk"></div>
    </section>
  </main>

  <script src="/js/core.js?v=3.12"></script>
  <script>
  (function () {
    'use strict';

    App.mount('mes');

    var boot = null;      // GET /api/bootstrap
    var dados = null;     // payload de mês (fonte única da verdade — vem do backend)
    var sel = App.mesAtual();
    var editando = {};    // lancamento_id -> true (painel de edição inline aberto)
    var carregando = false;
    var lancAberto = null; // card "Lançar contas" expandido? (null = decide pelo mês)

    var elTabs = document.getElementById('tabs');
    var elConteudo = document.getElementById('conteudo');

    // ---------- helpers ----------
    function esc(s) { return App.escapeHtml(s == null ? '' : String(s)); }
    function money(n) { return App.money(Number(n) || 0); }
    function el(id) { return document.getElementById(id); }
    function val(id) { var e = el(id); return e ? e.value : ''; }
    function valData(id) { var v = (val(id) || '').trim(); return v ? v : null; }

    // aceita "1.234,56", "1234.56", "R$ 90" — o front só lê, quem calcula é o backend
    function parseMoeda(v) {
      var s = String(v == null ? '' : v).replace(/[^0-9,.-]/g, '').trim();
      if (!s) return 0;
      if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
      var n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }
    function moedaInput(n) {
      var v = Number(n) || 0;
      return v ? App.num(v) : '';
    }
    function listaPt(arr) {
      var a = (arr || []).map(function (x) { return String(x); });
      if (!a.length) return '—';
      if (a.length === 1) return a[0];
      return a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
    }
    function badgeVenc(iso) {
      if (!iso) return '';
      var s = App.statusVenc(iso);
      if (!s || !s.texto) return '';
      return '<span class="badge ' + esc(s.classe) + '">' + esc(s.texto) + '</span>';
    }
    function ocupado(btn, ligado, texto) {
      if (!btn) return;
      if (ligado) {
        if (!btn.dataset.txt) btn.dataset.txt = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = esc(texto || 'Salvando…');
      } else {
        btn.disabled = false;
        if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt;
      }
    }
    function dis(b) { return b ? ' disabled' : ''; }

    // ---------- carga ----------
    function skeleton() {
      elConteudo.innerHTML =
        '<div class="skeleton m-sk"></div>' +
        '<div class="skeleton m-sk-alto"></div>' +
        '<div class="skeleton m-sk"></div>';
    }

    function erroTela(e) {
      elConteudo.innerHTML =
        '<div class="empty">' +
        '<div class="empty-icon">⚠️</div>' +
        '<p class="strong">Não deu para carregar o mês</p>' +
        '<p class="muted small">' + esc((e && e.message) || 'Erro inesperado') + '</p>' +
        '<p><button type="button" class="btn btn-primary" data-acao="recarregar">Tentar de novo</button></p>' +
        '</div>';
    }

    async function iniciar() {
      sel = App.mesAtual();
      skeleton();
      try {
        boot = await App.api('/bootstrap');
      } catch (e) {
        erroTela(e);
        return;
      }
      if (!boot.meses) boot.meses = [];
      renderTabs();
      await carregarMes(sel.ano, sel.mes);
    }

    async function carregarMes(ano, mes) {
      if (carregando) return;
      carregando = true;
      editando = {};
      lancAberto = null;
      skeleton();
      try {
        var p = await App.api('/mes/' + ano + '/' + mes);
        sel = { ano: ano, mes: mes };
        App.setMes(ano, mes);
        aplicar(p);
        renderTabs();
      } catch (e) {
        erroTela(e);
      } finally {
        carregando = false;
      }
    }

    // Toda rota de escrita devolve mes_completo: uma requisição, tela inteira atualizada.
    function aplicar(payload) {
      if (!payload || !payload.mes) {
        App.toast('Resposta do servidor sem os dados do mês', 'err');
        return;
      }
      dados = payload;
      sincronizarLista();
      render();
      renderTabs();
    }

    // mantém as abas coerentes com o mês carregado (inclusive quando foi criado agora)
    function sincronizarLista() {
      if (!boot || !dados) return;
      var m = dados.mes;
      var achou = null;
      for (var i = 0; i < boot.meses.length; i++) {
        if (boot.meses[i].ano === m.ano && boot.meses[i].mes === m.mes) { achou = boot.meses[i]; break; }
      }
      if (achou) {
        achou.fechado = m.fechado ? 1 : 0;
      } else {
        boot.meses.push({ ano: m.ano, mes: m.mes, label: m.label || App.mesLabel(m.ano, m.mes), fechado: m.fechado ? 1 : 0 });
        boot.meses.sort(function (a, b) { return (a.ano - b.ano) || (a.mes - b.mes); });
      }
    }

    function proximoMes() {
      var lista = (boot && boot.meses) || [];
      if (!lista.length) return { ano: App.INICIO.ano, mes: App.INICIO.mes };
      var u = lista[lista.length - 1];
      var a = u.ano, m = u.mes + 1;
      if (m > 12) { m = 1; a += 1; }
      return { ano: a, mes: m };
    }

    // ---------- abas de mês ----------
    function renderTabs() {
      var lista = (boot && boot.meses) || [];
      var h = '<div class="tabs tabs-scroll" role="tablist" aria-label="Selecionar mês">';
      lista.forEach(function (m) {
        var ativo = (m.ano === sel.ano && m.mes === sel.mes);
        var curto = App.nomeMes(m.mes).slice(0, 3) + '/' + String(m.ano).slice(-2);
        var full = m.label || App.mesLabel(m.ano, m.mes);
        h += '<button type="button" role="tab" aria-selected="' + (ativo ? 'true' : 'false') + '"' +
          ' class="tab' + (ativo ? ' is-active' : '') + '"' +
          ' title="' + esc(full) + '" data-acao="ir-mes" data-ano="' + m.ano + '" data-mes="' + m.mes + '">' +
          esc(curto) + (m.fechado ? ' 🔒' : '') + '</button>';
      });
      var p = proximoMes();
      var lp = App.mesLabel(p.ano, p.mes);
      h += '<button type="button" class="tab m-tab-novo" data-acao="novo-mes"' +
        ' aria-label="Criar ' + esc(lp) + '" title="Criar ' + esc(lp) + '">+</button>';
      h += '</div>';
      elTabs.innerHTML = h;

      var ativo = elTabs.querySelector('.tab.is-active');
      var faixa = elTabs.querySelector('.tabs-scroll');
      if (ativo && faixa) {
        faixa.scrollLeft = ativo.offsetLeft - (faixa.clientWidth / 2) + (ativo.offsetWidth / 2);
      }
    }

    // ---------- render principal ----------
    function render() {
      if (!dados) return;
      var bloq = !!dados.mes.fechado;
      elConteudo.innerHTML =
        secTopo(bloq) +
        secContas(bloq) +
        secKpis() +
        secCasas(bloq) +
        secAcoes(bloq);
    }

    function secTopo(bloq) {
      var m = dados.mes;
      return '<div class="m-topo">' +
        '<h1 class="m-tit">' + esc(m.label || App.mesLabel(m.ano, m.mes)) + '</h1>' +
        (bloq ? '<span class="badge badge-warn">Mês fechado</span>' : '') +
        '</div>' +
        (bloq ? '<p class="muted small">Mês fechado para edição. Reabra lá embaixo para lançar ou marcar pagamentos.</p>' : '');
    }

    // Uma linha por conta: rótulo, valor, vencimento e o rateio já calculado.
    function linhaLanc(cor, rotulo, idValor, valor, idVenc, venc, hint, bloq, semValor) {
      var h = '<div class="ml-linha">' +
        '<span class="ml-rot"><i class="ml-pt ml-pt-' + cor + '" aria-hidden="true"></i>' +
        esc(rotulo) + '</span>';

      if (semValor) {
        h += '<span class="dim small">valor é por casa</span>';
      } else {
        h += '<div class="input-money"><input class="input" id="' + idValor + '" type="text"' +
          ' inputmode="decimal" placeholder="0,00" aria-label="Valor de ' + esc(rotulo) + '"' +
          ' value="' + esc(moedaInput(valor)) + '"' + dis(bloq) + '></div>';
      }

      h += '<input class="input" id="' + idVenc + '" type="date" aria-label="Vencimento de ' + esc(rotulo) + '"' +
        ' value="' + esc(venc || '') + '"' + dis(bloq) + '>';

      var badge = venc ? badgeVenc(venc) : '';
      if (hint || badge) {
        h += '<span class="ml-hint">' + (hint ? esc(hint) : '') + (hint && badge ? ' · ' : '') + badge + '</span>';
      }
      return h + '</div>';
    }

    function secContas(bloq) {
      var m = dados.mes;
      var agua = dados.agua || { total: 0, moradores_total: 0, valor_por_cabeca: 0 };
      var relogios = dados.relogios || [];

      var luzTotal = relogios.reduce(function (s2, r) { return s2 + (Number(r.valor_total) || 0); }, 0);
      // mês ainda sem nada lançado começa aberto; já lançado começa fechado
      if (lancAberto === null) lancAberto = !(Number(m.agua_total) > 0 || luzTotal > 0);

      var resumo = 'Água ' + money(m.agua_total) + ' · Luz ' + money(luzTotal) +
        ' — toque para ' + (lancAberto ? 'recolher' : 'lançar ou editar');

      var h = '<section class="card card-accent-brand m-lanc' + (lancAberto ? ' is-aberto' : '') + '">' +
        '<div class="card-head m-lanc-head" data-acao="toggle-lanc" role="button" tabindex="0"' +
        ' aria-expanded="' + (lancAberto ? 'true' : 'false') + '">' +
        '<div><div class="card-title">Lançar contas de ' + esc(m.label || '') + '</div>' +
        '<div class="card-sub">' + esc(resumo) + '</div></div>' +
        '<span class="m-lanc-seta" aria-hidden="true">▾</span>' +
        '</div>' +
        '<div class="card-body">';

      h += linhaLanc('agua', 'Água', 'f-agua-total', m.agua_total, 'f-agua-venc', m.agua_vencimento,
        money(agua.valor_por_cabeca) + ' por pessoa · ' + (agua.moradores_total || 0) + ' no mês', bloq);

      if (!relogios.length) {
        h += '<p class="muted small">Nenhum relógio de luz configurado neste mês.</p>';
      }
      relogios.forEach(function (r) {
        var casas = (r.casas || []).join(', ');
        h += linhaLanc('luz', r.nome || ('Relógio ' + r.relogio),
          'f-luz-valor-' + r.relogio, r.valor_total, 'f-luz-venc-' + r.relogio, r.vencimento,
          money(r.valor_por_peso) + ' por casa · ' + (casas ? 'casas ' + casas + ' · ' : '') +
          (r.casas_ocupadas || 0) + ' ocupada(s)', bloq);
      });

      h += linhaLanc('aluguel', 'Aluguel', null, 0, 'f-aluguel-venc', m.aluguel_vencimento,
        'edite o valor no card de cada casa', bloq, true);

      h += '</div>' +
        '<div class="card-foot">' +
        '<button type="button" class="btn btn-primary btn-lg btn-block" data-acao="salvar-mes"' + dis(bloq) + '>Salvar e calcular</button>' +
        '</div></section>';
      return h;
    }

    function secKpis() {
      var t = dados.totais || {};
      function stat(label, valor, hint, cls) {
        return '<div class="stat ' + (cls || '') + '">' +
          '<div class="stat-label">' + esc(label) + '</div>' +
          '<div class="stat-value">' + valor + '</div>' +
          '<div class="stat-hint">' + hint + '</div></div>';
      }
      // Água + luz + outros de um lado; aluguel do outro — são cobranças separadas.
      return '<div class="stat-row">' +
        stat('Contas (água+luz+outros)', money(t.contas_cobrado),
          'recebido ' + money(t.contas_recebido) + ' · aberto ' + money(t.contas_aberto), 'is-agua') +
        stat('Aluguel', money(t.aluguel_cobrado),
          'recebido ' + money(t.aluguel_recebido) + ' · aberto ' + money(t.aluguel_aberto), 'is-aluguel') +
        stat('Em aberto', money(t.total_aberto),
          'contas ' + money(t.contas_aberto) + ' · aluguel ' + money(t.aluguel_aberto),
          Number(t.total_aberto) > 0 ? 'is-open' : 'is-ok') +
        stat('Casas pagas', esc(String(t.casas_pagas || 0)) + ' / ' + esc(String((t.casas_pagas || 0) + (t.casas_devendo || 0))),
          esc(String(t.casas_devendo || 0)) + ' devendo · ' + esc(String(t.casas_vagas || 0)) + ' vaga(s)') +
        '</div>';
    }

    // --- tabela das casas ---
    // Cada célula de conta é um label com checkbox: um clique marca o pagamento.
    function celItem(c, chave, rotulo, venc, bloq) {
      var valor = Number(c[chave + '_valor']) || 0;
      var pago = !!c[chave + '_pago'];
      var zero = valor <= 0;

      // "outros" zerado vira o botão de lançar cobrança avulsa
      if (zero && chave === 'outros') {
        if (bloq) return '<span class="mt-cel is-zero"><span class="mt-val">—</span></span>';
        return '<button type="button" class="mt-add" data-acao="editar-outros" data-id="' +
          c.lancamento_id + '" title="Lançar uma cobrança avulsa para esta casa">+ lançar</button>';
      }

      var titulo = rotulo;
      var atrasado = false;
      if (!zero && !pago && venc) {
        var st = App.statusVenc(venc);
        if (st && st.texto) { titulo = rotulo + ' — ' + st.texto; atrasado = st.dias !== null && st.dias < 0; }
      }
      if (pago && c[chave + '_pago_em']) titulo = rotulo + ' — pago em ' + App.dataBR(c[chave + '_pago_em']);
      if (chave === 'outros' && c.outros_descricao) titulo = c.outros_descricao + ' — ' + titulo;

      var travado = bloq || zero;
      return '<label class="mt-cel' + (zero ? ' is-zero' : '') + (pago ? ' is-pago' : '') +
        (bloq ? ' is-bloq' : '') + (atrasado ? ' is-atrasado' : '') +
        '" title="' + esc(titulo) + '">' +
        '<input type="checkbox" class="js-pago" data-id="' + c.lancamento_id + '" data-item="' + chave + '"' +
        (pago ? ' checked' : '') + dis(travado) +
        ' aria-label="' + esc(rotulo + ' da casa ' + c.casa_str) + '">' +
        '<span class="mt-val">' + (zero ? '—' : money(valor)) + '</span>' +
        '</label>';
    }

    function linhaCasa(c, bloq) {
      var m = dados.mes;
      var vaga = !!c.vazia;
      var aluguelAberto = round2(Number(c.total_aberto) - Number(c.contas_aberto));

      var selo = vaga
        ? '<span class="badge badge-dim">vaga</span>'
        : (c.tudo_pago ? '<span class="badge badge-ok">quitada</span>'
                       : '<span class="badge badge-err">em aberto</span>');

      var identidade = '<td data-label="Casa">' +
        '<div class="mt-casa">Casa ' + esc(c.casa_str) + selo + '</div>' +
        '<div class="mt-sub">' +
        (vaga ? 'sem inquilino'
          : esc(c.inquilino || 'sem nome') + ' · ' + esc(String(c.moradores || 0)) +
            (Number(c.moradores) === 1 ? ' morador' : ' moradores') + ' · rel. ' + esc(String(c.relogio))) +
        '</div></td>';

      if (vaga) {
        return '<tr class="is-vaga">' + identidade +
          '<td class="td-item" colspan="4"><span class="muted small">Fora do rateio de água e luz neste mês.</span></td>' +
          '<td class="mt-aberto">—</td><td class="td-acoes"></td></tr>';
      }

      var h = '<tr' + (c.tudo_pago ? ' class="is-quitada"' : '') + '>' + identidade +
        '<td class="td-item" data-label="Água">' + celItem(c, 'agua', 'Água', m.agua_vencimento, bloq) + '</td>' +
        '<td class="td-item" data-label="Luz">' + celItem(c, 'luz', 'Luz', vencDoRelogio(c.relogio), bloq) + '</td>' +
        '<td class="td-item" data-label="Outros">' + celItem(c, 'outros', 'Outros', null, bloq) + '</td>' +
        '<td class="td-item" data-label="Aluguel">' + celItem(c, 'aluguel', 'Aluguel', m.aluguel_vencimento, bloq) + '</td>' +
        '<td data-label="Em aberto"><div class="mt-aberto">' +
          (Number(c.total_aberto) > 0
            ? '<div><span class="mt-l">contas </span><b class="money ' +
                (Number(c.contas_aberto) > 0 ? 'money-open' : 'money-paid') + '">' + money(c.contas_aberto) + '</b></div>' +
              '<div><span class="mt-l">aluguel </span><b class="money ' +
                (aluguelAberto > 0 ? 'money-open' : 'money-paid') + '">' + money(aluguelAberto) + '</b></div>'
            : '<b class="money money-paid">tudo pago</b>' +
              (c.quitado_em ? '<div class="mt-l">' + esc(App.dataCurta(c.quitado_em)) + '</div>' : '')) +
        '</div></td>' +
        '<td class="td-acoes">' +
          '<button type="button" class="btn btn-ghost btn-sm btn-icon" data-acao="editar" data-id="' + c.lancamento_id + '"' +
          dis(bloq) + ' title="Editar outros e aluguel" aria-label="Editar valores da casa ' + esc(c.casa_str) + '">✎</button> ' +
          botoesQuitar(c, bloq) +
        '</td></tr>';

      if (c.obs) {
        h += '<tr><td colspan="7" class="muted small">' + esc(c.obs) + '</td></tr>';
      }
      if (editando[c.lancamento_id]) {
        h += '<tr><td colspan="7" class="mt-edit-td">' + painelEdicao(c) + '</td></tr>';
      }
      return h;
    }

    /* Aluguel é cobrado à parte, então quitar em bloco NUNCA pode incluí-lo por
       tabela: o botão principal fecha só as contas, e o aluguel é um clique
       próprio e explícito. */
    function botoesQuitar(c, bloq) {
      if (c.tudo_pago) {
        return '<button type="button" class="btn btn-outline btn-sm" data-acao="quitar" ' +
          'data-item="tudo" data-id="' + c.lancamento_id + '" data-pago="0"' + dis(bloq) +
          '>Desfazer tudo</button>';
      }
      var temContas = Number(c.contas_valor) > 0;
      var contasAbertas = temContas && !c.contas_quitadas;
      var aluguelAberto = Number(c.aluguel_valor) > 0 && !c.aluguel_pago;

      var h = '';
      if (contasAbertas) {
        h += '<button type="button" class="btn btn-primary btn-sm" data-acao="quitar" ' +
          'data-item="contas" data-id="' + c.lancamento_id + '" data-pago="1"' + dis(bloq) +
          ' title="Marca água, luz e outros — não mexe no aluguel">Quitar contas</button> ';
      }
      if (aluguelAberto) {
        h += '<button type="button" class="btn btn-outline btn-sm" data-acao="quitar" ' +
          'data-item="aluguel" data-id="' + c.lancamento_id + '" data-pago="1"' + dis(bloq) +
          ' title="Marca só o aluguel">Quitar aluguel</button>';
      }
      return h;
    }

    function round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }

    function painelEdicao(c) {
      var id = c.lancamento_id;
      return '<div class="m-edit stack" data-edit="' + id + '">' +
        '<div class="form-grid">' +
        '<div class="field"><label class="field-label" for="e-outros-' + id + '">Outros (R$)</label>' +
        '<div class="input-money"><input class="input" id="e-outros-' + id + '" type="text" inputmode="decimal" placeholder="0,00" value="' +
        esc(moedaInput(c.outros_valor)) + '"></div></div>' +
        '<div class="field"><label class="field-label" for="e-outros-desc-' + id + '">Descrição de "outros"</label>' +
        '<input class="input" id="e-outros-desc-' + id + '" type="text" maxlength="120" placeholder="ex.: gás, conserto do portão" value="' +
        esc(c.outros_descricao || '') + '"></div>' +
        '<div class="field"><label class="field-label" for="e-aluguel-' + id + '">Aluguel (R$)</label>' +
        '<div class="input-money"><input class="input" id="e-aluguel-' + id + '" type="text" inputmode="decimal" placeholder="0,00" value="' +
        esc(moedaInput(c.aluguel_valor)) + '"></div>' +
        '<span class="field-hint">Padrão da casa: ' + money(c.aluguel_padrao) + '</span></div>' +
        '</div>' +
        '<div class="row">' +
        '<button type="button" class="btn btn-primary btn-sm" data-acao="salvar-lanc" data-id="' + id + '">Salvar valores</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-acao="cancelar-edit" data-id="' + id + '">Cancelar</button>' +
        '</div></div>';
    }

    function vencDoRelogio(relogio) {
      var rs = dados.relogios || [];
      for (var i = 0; i < rs.length; i++) if (rs[i].relogio === relogio) return rs[i].vencimento;
      return null;
    }

    function secCasas(bloq) {
      var casas = dados.casas || [];
      if (!casas.length) {
        return '<div class="empty"><div class="empty-icon">🏠</div>' +
          '<p class="strong">Nenhuma casa neste mês</p>' +
          '<p class="muted small">Cadastre as casas para começar a lançar.</p>' +
          '<p><a class="btn btn-primary" href="/casas">Ir para Casas</a></p></div>';
      }
      var t = dados.totais || {};
      var h = '<h2 class="m-sec-tit">Casas</h2>' +
        '<div class="table-wrap"><table class="table table-cards mt">' +
        '<thead><tr>' +
          '<th>Casa</th>' +
          '<th class="td-num th-agua">💧 Água</th>' +
          '<th class="td-num th-luz">💡 Luz</th>' +
          '<th class="td-num th-outros">📦 Outros</th>' +
          '<th class="td-num th-aluguel">🔑 Aluguel</th>' +
          '<th class="td-num">Em aberto</th>' +
          '<th class="td-acoes"></th>' +
        '</tr></thead><tbody>';

      casas.forEach(function (c) { h += linhaCasa(c, bloq); });

      h += '</tbody><tfoot><tr>' +
        '<td data-label="Totais"><span class="strong">Totais do mês</span></td>' +
        '<td class="td-num" data-label="Água"><span class="money">' + money(t.agua_cobrado) + '</span></td>' +
        '<td class="td-num" data-label="Luz"><span class="money">' + money(t.luz_cobrado) + '</span></td>' +
        '<td class="td-num" data-label="Outros"><span class="money">' + money(t.outros_cobrado) + '</span></td>' +
        '<td class="td-num" data-label="Aluguel"><span class="money">' + money(t.aluguel_cobrado) + '</span></td>' +
        '<td class="td-num" data-label="Em aberto"><span class="money ' +
          (Number(t.total_aberto) > 0 ? 'money-open' : 'money-paid') + '">' + money(t.total_aberto) + '</span></td>' +
        '<td></td>' +
        '</tr></tfoot></table></div>';
      return h;
    }

    function secAcoes(bloq) {
      var m = dados.mes;
      return '<section class="card">' +
        '<div class="card-head"><div class="card-title">Ações do mês</div></div>' +
        '<div class="card-body m-acoes">' +
        '<a class="btn btn-wa" href="/whatsapp">Gerar mensagens</a>' +
        '<button type="button" class="btn btn-outline" data-acao="fechar-mes" data-fechado="' + (bloq ? '0' : '1') + '">' +
        (bloq ? 'Reabrir mês' : 'Fechar mês') + '</button>' +
        '<button type="button" class="btn btn-danger" data-acao="limpar-mes"' + dis(bloq) + '>Limpar mês</button>' +
        '</div>' +
        '<div class="card-foot"><p class="dim small">Limpar zera contas, vencimentos, "outros" e as marcações de pagamento de ' +
        esc(m.label || '') + '. Inquilinos, moradores e aluguel são mantidos.</p></div>' +
        '</section>';
    }

    // ---------- ações ----------
    async function salvarMes(btn) {
      var body = {
        agua_total: parseMoeda(val('f-agua-total')),
        agua_vencimento: valData('f-agua-venc'),
        aluguel_vencimento: valData('f-aluguel-venc'),
        relogios: (dados.relogios || []).map(function (r) {
          return {
            relogio: r.relogio,
            valor_total: parseMoeda(val('f-luz-valor-' + r.relogio)),
            vencimento: valData('f-luz-venc-' + r.relogio)
          };
        })
      };
      ocupado(btn, true, 'Salvando…');
      try {
        var r = await App.api('/mes/' + dados.mes.id, { method: 'PUT', body: body });
        aplicar(r.mes_completo);
        App.toast('Contas salvas e rateio recalculado', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function marcarPago(id, item, pago, caixa) {
      if (caixa) caixa.disabled = true;
      try {
        var r = await App.api('/lancamento/' + id + '/pago', { method: 'PUT', body: { item: item, pago: !!pago } });
        aplicar(r.mes_completo);
        var NOME = { contas: 'Contas (água, luz e outros)', tudo: 'Tudo', agua: 'Água',
                     luz: 'Luz', outros: 'Outros', aluguel: 'Aluguel' };
        var alvo = NOME[item] || 'Pagamento';
        App.toast(alvo + (pago ? ' marcado como pago' : ' desmarcado'), 'ok');
      } catch (e) {
        if (caixa) { caixa.checked = !pago; caixa.disabled = false; }
      }
    }

    async function salvarLancamento(id, btn) {
      var desc = (val('e-outros-desc-' + id) || '').trim();
      var body = {
        outros_valor: parseMoeda(val('e-outros-' + id)),
        outros_descricao: desc || null,
        aluguel_valor: parseMoeda(val('e-aluguel-' + id))
      };
      ocupado(btn, true, 'Salvando…');
      try {
        var r = await App.api('/lancamento/' + id, { method: 'PUT', body: body });
        delete editando[id];
        aplicar(r.mes_completo);
        App.toast('Valores da casa atualizados', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function limparMes(btn) {
      var ok = await App.confirmar({
        titulo: 'Limpar o mês?',
        texto: 'Zera água, contas de luz, vencimentos, "outros" e todas as marcações de pagamento de ' +
          (dados.mes.label || '') + '. Inquilinos, moradores e aluguel continuam.',
        ok: 'Limpar mês',
        cancelar: 'Cancelar',
        perigo: true
      });
      if (!ok) return;
      ocupado(btn, true, 'Limpando…');
      try {
        var r = await App.api('/mes/' + dados.mes.id + '/limpar', { method: 'POST' });
        editando = {};
        aplicar(r.mes_completo);
        App.toast('Mês limpo', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function fecharMes(fechado, btn) {
      if (fechado) {
        var ok = await App.confirmar({
          titulo: 'Fechar o mês?',
          texto: 'Com o mês fechado nada mais pode ser lançado nem marcado como pago. Dá para reabrir depois.',
          ok: 'Fechar mês',
          cancelar: 'Cancelar'
        });
        if (!ok) return;
      }
      ocupado(btn, true, fechado ? 'Fechando…' : 'Reabrindo…');
      try {
        var r = await App.api('/mes/' + dados.mes.id + '/fechar', { method: 'PUT', body: { fechado: !!fechado } });
        if (fechado) editando = {};
        aplicar(r.mes_completo);
        App.toast(fechado ? 'Mês fechado' : 'Mês reaberto', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function criarProximo(btn) {
      var p = proximoMes();
      var ok = await App.confirmar({
        titulo: 'Criar ' + App.mesLabel(p.ano, p.mes) + '?',
        texto: 'Um lançamento por casa será criado com os dados atuais de inquilino, moradores e aluguel.',
        ok: 'Criar mês',
        cancelar: 'Cancelar'
      });
      if (!ok) return;
      ocupado(btn, true, '…');
      await carregarMes(p.ano, p.mes);
      App.toast(App.mesLabel(p.ano, p.mes) + ' pronto para lançar', 'ok');
    }

    // ---------- eventos (delegação) ----------
    document.addEventListener('click', function (ev) {
      var alvo = ev.target;
      if (!alvo || !alvo.closest) return;
      var btn = alvo.closest('[data-acao]');
      if (!btn) return;
      var acao = btn.getAttribute('data-acao');
      var id = btn.getAttribute('data-id');

      if (acao === 'ir-mes') {
        ev.preventDefault();
        carregarMes(parseInt(btn.getAttribute('data-ano'), 10), parseInt(btn.getAttribute('data-mes'), 10));
      } else if (acao === 'novo-mes') {
        ev.preventDefault();
        criarProximo(btn);
      } else if (acao === 'recarregar') {
        ev.preventDefault();
        iniciar();
      } else if (acao === 'salvar-mes') {
        ev.preventDefault();
        salvarMes(btn);
      } else if (acao === 'toggle-lanc') {
        ev.preventDefault();
        lancAberto = !lancAberto;
        render();
      } else if (acao === 'editar') {
        ev.preventDefault();
        if (editando[id]) delete editando[id]; else editando[id] = true;
        render();
      } else if (acao === 'editar-outros') {
        ev.preventDefault();
        editando[id] = true;
        render();
        var campo = document.getElementById('e-outros-' + id);
        if (campo) { campo.focus(); campo.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      } else if (acao === 'cancelar-edit') {
        ev.preventDefault();
        delete editando[id];
        render();
      } else if (acao === 'salvar-lanc') {
        ev.preventDefault();
        salvarLancamento(id, btn);
      } else if (acao === 'quitar') {
        ev.preventDefault();
        marcarPago(id, btn.getAttribute('data-item') || 'contas',
          btn.getAttribute('data-pago') === '1', null);
      } else if (acao === 'limpar-mes') {
        ev.preventDefault();
        limparMes(btn);
      } else if (acao === 'fechar-mes') {
        ev.preventDefault();
        fecharMes(btn.getAttribute('data-fechado') === '1', btn);
      }
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var alvo = ev.target && ev.target.closest ? ev.target.closest('[data-acao="toggle-lanc"]') : null;
      if (!alvo) return;
      ev.preventDefault();
      lancAberto = !lancAberto;
      render();
    });

    document.addEventListener('change', function (ev) {
      var alvo = ev.target;
      if (!alvo || !alvo.closest) return;
      var caixa = alvo.closest('.js-pago');
      if (!caixa) return;
      marcarPago(caixa.getAttribute('data-id'), caixa.getAttribute('data-item'), caixa.checked, caixa);
    });

    iniciar();
  })();
  </script>
</body>
</html>
