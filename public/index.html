<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Quintal — Mês</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Regras específicas da tela de Mês (usam os tokens do app.css) */
    .m-tit{font-size:1.35rem;line-height:1.2;margin:0;font-weight:800;letter-spacing:.4px}
    .m-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

    /* linha de rateio calculado pelo backend */
    .m-rateio{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
      background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);
      padding:10px 12px}
    .m-rateio b{font-size:1.05rem}

    /* bloco de um relógio de luz dentro do card de contas */
    .m-relogio{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--bg-2)}

    /* item cobrável dentro do card da casa */
    .m-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
      padding:10px 4px;border-top:1px solid var(--line);min-height:48px;cursor:pointer}
    .m-item:first-child{border-top:0}
    .m-item-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
    .m-item-val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    .m-item.is-zero{opacity:.5;cursor:default}
    .m-item.is-bloq{cursor:default}

    /* casa vaga: presente, porém discreta */
    .m-vaga{opacity:.62}
    .m-vaga .card-title{font-weight:600}

    .m-casa-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
    .m-casa-tot{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

    .m-edit{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}

    .m-tab-novo{font-weight:800;font-size:1.15rem;min-width:44px}

    .m-sk{height:96px;border-radius:var(--r)}
    .m-sk-alto{height:220px;border-radius:var(--r)}
    .m-acoes{display:flex;gap:10px;flex-wrap:wrap}
    .m-acoes .btn{flex:1 1 190px}

    @media (max-width:520px){
      .m-item{grid-template-columns:auto 1fr;row-gap:2px}
      .m-item-val{grid-column:2;text-align:left}
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="container" id="app">
    <section id="tabs" class="stack" aria-label="Meses"></section>
    <section id="conteudo" class="stack">
      <div class="skeleton m-sk"></div>
      <div class="skeleton m-sk-alto"></div>
      <div class="skeleton m-sk"></div>
    </section>
  </main>

  <script src="/js/core.js"></script>
  <script>
  (function () {
    'use strict';

    App.mount('mes');

    var boot = null;      // GET /api/bootstrap
    var dados = null;     // payload de mês (fonte única da verdade — vem do backend)
    var sel = App.mesAtual();
    var editando = {};    // lancamento_id -> true (painel de edição inline aberto)
    var carregando = false;

    var elTabs = document.getElementById('tabs');
    var elConteudo = document.getElementById('conteudo');

    // ---------- helpers ----------
    function esc(s) { return App.escapeHtml(s == null ? '' : String(s)); }
    function money(n) { return App.money(Number(n) || 0); }
    function el(id) { return document.getElementById(id); }
    function val(id) { var e = el(id); return e ? e.value : ''; }
    function valData(id) { var v = (val(id) || '').trim(); return v ? v : null; }

    // aceita "1.234,56", "1234.56", "R$ 90" — o front só lê, quem calcula é o backend
    function parseMoeda(v) {
      var s = String(v == null ? '' : v).replace(/[^0-9,.-]/g, '').trim();
      if (!s) return 0;
      if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
      var n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }
    function moedaInput(n) {
      var v = Number(n) || 0;
      return v ? App.num(v) : '';
    }
    function listaPt(arr) {
      var a = (arr || []).map(function (x) { return String(x); });
      if (!a.length) return '—';
      if (a.length === 1) return a[0];
      return a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
    }
    function badgeVenc(iso) {
      if (!iso) return '';
      var s = App.statusVenc(iso);
      if (!s || !s.texto) return '';
      return '<span class="badge ' + esc(s.classe) + '">' + esc(s.texto) + '</span>';
    }
    function ocupado(btn, ligado, texto) {
      if (!btn) return;
      if (ligado) {
        if (!btn.dataset.txt) btn.dataset.txt = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = esc(texto || 'Salvando…');
      } else {
        btn.disabled = false;
        if (btn.dataset.txt) btn.innerHTML = btn.dataset.txt;
      }
    }
    function dis(b) { return b ? ' disabled' : ''; }

    // ---------- carga ----------
    function skeleton() {
      elConteudo.innerHTML =
        '<div class="skeleton m-sk"></div>' +
        '<div class="skeleton m-sk-alto"></div>' +
        '<div class="skeleton m-sk"></div>';
    }

    function erroTela(e) {
      elConteudo.innerHTML =
        '<div class="empty">' +
        '<div class="empty-icon">⚠️</div>' +
        '<p class="strong">Não deu para carregar o mês</p>' +
        '<p class="muted small">' + esc((e && e.message) || 'Erro inesperado') + '</p>' +
        '<p><button type="button" class="btn btn-primary" data-acao="recarregar">Tentar de novo</button></p>' +
        '</div>';
    }

    async function iniciar() {
      sel = App.mesAtual();
      skeleton();
      try {
        boot = await App.api('/bootstrap');
      } catch (e) {
        erroTela(e);
        return;
      }
      if (!boot.meses) boot.meses = [];
      renderTabs();
      await carregarMes(sel.ano, sel.mes);
    }

    async function carregarMes(ano, mes) {
      if (carregando) return;
      carregando = true;
      editando = {};
      skeleton();
      try {
        var p = await App.api('/mes/' + ano + '/' + mes);
        sel = { ano: ano, mes: mes };
        App.setMes(ano, mes);
        aplicar(p);
        renderTabs();
      } catch (e) {
        erroTela(e);
      } finally {
        carregando = false;
      }
    }

    // Toda rota de escrita devolve mes_completo: uma requisição, tela inteira atualizada.
    function aplicar(payload) {
      if (!payload || !payload.mes) {
        App.toast('Resposta do servidor sem os dados do mês', 'err');
        return;
      }
      dados = payload;
      sincronizarLista();
      render();
      renderTabs();
    }

    // mantém as abas coerentes com o mês carregado (inclusive quando foi criado agora)
    function sincronizarLista() {
      if (!boot || !dados) return;
      var m = dados.mes;
      var achou = null;
      for (var i = 0; i < boot.meses.length; i++) {
        if (boot.meses[i].ano === m.ano && boot.meses[i].mes === m.mes) { achou = boot.meses[i]; break; }
      }
      if (achou) {
        achou.fechado = m.fechado ? 1 : 0;
      } else {
        boot.meses.push({ ano: m.ano, mes: m.mes, label: m.label || App.mesLabel(m.ano, m.mes), fechado: m.fechado ? 1 : 0 });
        boot.meses.sort(function (a, b) { return (a.ano - b.ano) || (a.mes - b.mes); });
      }
    }

    function proximoMes() {
      var lista = (boot && boot.meses) || [];
      if (!lista.length) return { ano: App.INICIO.ano, mes: App.INICIO.mes };
      var u = lista[lista.length - 1];
      var a = u.ano, m = u.mes + 1;
      if (m > 12) { m = 1; a += 1; }
      return { ano: a, mes: m };
    }

    // ---------- abas de mês ----------
    function renderTabs() {
      var lista = (boot && boot.meses) || [];
      var h = '<div class="tabs tabs-scroll" role="tablist" aria-label="Selecionar mês">';
      lista.forEach(function (m) {
        var ativo = (m.ano === sel.ano && m.mes === sel.mes);
        var curto = App.nomeMes(m.mes).slice(0, 3) + '/' + String(m.ano).slice(-2);
        var full = m.label || App.mesLabel(m.ano, m.mes);
        h += '<button type="button" role="tab" aria-selected="' + (ativo ? 'true' : 'false') + '"' +
          ' class="tab' + (ativo ? ' is-active' : '') + '"' +
          ' title="' + esc(full) + '" data-acao="ir-mes" data-ano="' + m.ano + '" data-mes="' + m.mes + '">' +
          esc(curto) + (m.fechado ? ' 🔒' : '') + '</button>';
      });
      var p = proximoMes();
      var lp = App.mesLabel(p.ano, p.mes);
      h += '<button type="button" class="tab m-tab-novo" data-acao="novo-mes"' +
        ' aria-label="Criar ' + esc(lp) + '" title="Criar ' + esc(lp) + '">+</button>';
      h += '</div>';
      elTabs.innerHTML = h;

      var ativo = elTabs.querySelector('.tab.is-active');
      var faixa = elTabs.querySelector('.tabs-scroll');
      if (ativo && faixa) {
        faixa.scrollLeft = ativo.offsetLeft - (faixa.clientWidth / 2) + (ativo.offsetWidth / 2);
      }
    }

    // ---------- render principal ----------
    function render() {
      if (!dados) return;
      var bloq = !!dados.mes.fechado;
      elConteudo.innerHTML =
        secTopo(bloq) +
        secContas(bloq) +
        secKpis() +
        secCasas(bloq) +
        secAcoes(bloq);
    }

    function secTopo(bloq) {
      var m = dados.mes;
      return '<div class="m-topo">' +
        '<h1 class="m-tit">' + esc(m.label || App.mesLabel(m.ano, m.mes)) + '</h1>' +
        (bloq ? '<span class="badge badge-warn">Mês fechado</span>' : '') +
        '</div>' +
        (bloq ? '<p class="muted small">Mês fechado para edição. Reabra lá embaixo para lançar ou marcar pagamentos.</p>' : '');
    }

    function secContas(bloq) {
      var m = dados.mes;
      var agua = dados.agua || { total: 0, moradores_total: 0, valor_por_cabeca: 0 };
      var relogios = dados.relogios || [];

      var h = '<section class="card card-accent-brand">' +
        '<div class="card-head">' +
        '<div><div class="card-title">Contas do mês</div>' +
        '<div class="card-sub">Lance os valores e salve para o sistema calcular o rateio</div></div>' +
        '</div>' +
        '<div class="card-body stack">';

      // ÁGUA
      h += '<div class="stack">' +
        '<div class="row"><span class="badge badge-agua">Água</span>' +
        (m.agua_vencimento ? ' ' + badgeVenc(m.agua_vencimento) : '') + '</div>' +
        '<div class="form-grid">' +
        '<div class="field"><label class="field-label" for="f-agua-total">Valor total da água (R$)</label>' +
        '<div class="input-money"><input class="input" id="f-agua-total" type="text" inputmode="decimal" placeholder="0,00" value="' +
        esc(moedaInput(m.agua_total)) + '"' + dis(bloq) + '></div>' +
        '<span class="field-hint">Dividido por pessoa entre as casas ocupadas</span></div>' +
        '<div class="field"><label class="field-label" for="f-agua-venc">Vencimento da água</label>' +
        '<input class="input" id="f-agua-venc" type="date" value="' + esc(m.agua_vencimento || '') + '"' + dis(bloq) + '></div>' +
        '</div>' +
        '<div class="m-rateio"><span class="muted small">Rateio:</span> ' +
        '<b class="money">' + money(agua.valor_por_cabeca) + '</b> <span class="muted small">por pessoa</span>' +
        '<span class="dim small">· ' + esc(String(agua.moradores_total || 0)) + ' pessoa(s) no mês</span></div>' +
        '</div>';

      // LUZ — uma conta por relógio
      if (!relogios.length) {
        h += '<p class="muted small">Nenhum relógio de luz configurado neste mês.</p>';
      }
      relogios.forEach(function (r) {
        h += '<div class="m-relogio stack">' +
          '<div class="row"><span class="badge badge-luz">' + esc(r.nome || ('Relógio ' + r.relogio)) + '</span>' +
          (r.vencimento ? ' ' + badgeVenc(r.vencimento) : '') + '</div>' +
          '<p class="muted small">Casas ' + esc(listaPt(r.casas)) + ' · ' +
          esc(String(r.casas_ocupadas || 0)) + ' ocupada(s)</p>' +
          '<div class="form-grid">' +
          '<div class="field"><label class="field-label" for="f-luz-valor-' + r.relogio + '">Valor total (R$)</label>' +
          '<div class="input-money"><input class="input" id="f-luz-valor-' + r.relogio + '" type="text" inputmode="decimal" placeholder="0,00" value="' +
          esc(moedaInput(r.valor_total)) + '"' + dis(bloq) + '></div></div>' +
          '<div class="field"><label class="field-label" for="f-luz-venc-' + r.relogio + '">Vencimento</label>' +
          '<input class="input" id="f-luz-venc-' + r.relogio + '" type="date" value="' + esc(r.vencimento || '') + '"' + dis(bloq) + '></div>' +
          '</div>' +
          '<div class="m-rateio"><span class="muted small">Rateio:</span> ' +
          '<b class="money">' + money(r.valor_por_peso) + '</b> <span class="muted small">por casa (peso 1)</span>' +
          '<span class="dim small">· peso total ' + esc(App.num(r.peso_total || 0)) + '</span></div>' +
          '</div>';
      });

      // ALUGUEL
      h += '<div class="stack">' +
        '<div class="row"><span class="badge badge-aluguel">Aluguel</span>' +
        (m.aluguel_vencimento ? ' ' + badgeVenc(m.aluguel_vencimento) : '') + '</div>' +
        '<div class="form-grid">' +
        '<div class="field"><label class="field-label" for="f-aluguel-venc">Vencimento do aluguel</label>' +
        '<input class="input" id="f-aluguel-venc" type="date" value="' + esc(m.aluguel_vencimento || '') + '"' + dis(bloq) + '></div>' +
        '</div>' +
        '<p class="field-hint">O valor do aluguel é por casa — edite no card da casa.</p>' +
        '</div>';

      h += '</div>' +
        '<div class="card-foot">' +
        '<button type="button" class="btn btn-primary btn-lg btn-block" data-acao="salvar-mes"' + dis(bloq) + '>Salvar e calcular</button>' +
        '</div></section>';
      return h;
    }

    function secKpis() {
      var t = dados.totais || {};
      function stat(label, valor, hint, cls) {
        return '<div class="stat">' +
          '<div class="stat-label">' + esc(label) + '</div>' +
          '<div class="stat-value ' + (cls || '') + '">' + valor + '</div>' +
          '<div class="stat-hint">' + hint + '</div></div>';
      }
      return '<div class="stat-row">' +
        stat('Total cobrado', money(t.total_cobrado), esc(String(t.casas_ocupadas || 0)) + ' casa(s) ocupada(s)') +
        stat('Recebido', money(t.total_recebido), 'já pago pelos inquilinos', 'money-paid') +
        stat('Em aberto', money(t.total_aberto), 'falta receber', 'money-open') +
        stat('Casas pagas', esc(String(t.casas_pagas || 0)) + ' / ' + esc(String((t.casas_pagas || 0) + (t.casas_devendo || 0))),
          esc(String(t.casas_devendo || 0)) + ' devendo · ' + esc(String(t.casas_vagas || 0)) + ' vaga(s)') +
        '</div>';
    }

    // --- lista das casas ---
    function itemLinha(c, chave, rotulo, badgeCls, venc, bloq) {
      var valor = Number(c[chave + '_valor']) || 0;
      var pago = !!c[chave + '_pago'];
      var pagoEm = c[chave + '_pago_em'];
      var zero = valor <= 0;
      var travado = bloq || zero;
      var extra = '';
      if (chave === 'outros' && c.outros_descricao) {
        extra = '<span class="small truncate">' + esc(c.outros_descricao) + '</span>';
      }
      var direita = pago
        ? '<span class="small muted">pago em ' + esc(App.dataBR(pagoEm)) + '</span>'
        : (!zero && venc ? badgeVenc(venc) : '');

      return '<label class="m-item' + (zero ? ' is-zero' : '') + (bloq ? ' is-bloq' : '') + (pago ? ' is-pago' : '') + '">' +
        '<input type="checkbox" class="check js-pago" data-id="' + c.lancamento_id + '" data-item="' + chave + '"' +
        (pago ? ' checked' : '') + dis(travado) +
        ' aria-label="Marcar ' + esc(rotulo) + ' da casa ' + esc(c.casa_str) + ' como pago">' +
        '<span class="m-item-info">' +
        '<span class="badge ' + badgeCls + '">' + esc(rotulo) + '</span>' + extra +
        (direita ? ' ' + direita : '') +
        '</span>' +
        '<span class="m-item-val money ' + (zero ? 'dim' : (pago ? 'money-paid' : 'money-open')) + '">' + money(valor) + '</span>' +
        '</label>';
    }

    function cardCasa(c, bloq) {
      var m = dados.mes;
      var vaga = !!c.vazia;
      var h = '<article class="card' + (vaga ? ' m-vaga' : '') + '" data-casa="' + c.casa_id + '">' +
        '<div class="card-head">' +
        '<div><div class="card-title">Casa ' + esc(c.casa_str) + ' ' +
        (vaga ? '<span class="badge badge-dim">vaga</span>'
          : (c.tudo_pago ? '<span class="badge badge-ok">quitada</span>' : '<span class="badge badge-err">em aberto</span>')) +
        '</div>' +
        '<div class="card-sub">' +
        (vaga ? 'sem inquilino — nada a cobrar'
          : esc(c.inquilino || 'sem nome') + ' · ' + esc(String(c.moradores || 0)) + ' morador(es) · relógio ' + esc(String(c.relogio))) +
        '</div></div>' +
        (vaga ? '' : '<div class="right money-lg money">' + money(c.total_mes) + '</div>') +
        '</div>';

      if (vaga) {
        h += '<div class="card-body"><p class="muted small">Casa desocupada neste mês: não entra no rateio da água nem da luz.</p></div>';
        h += '</article>';
        return h;
      }

      h += '<div class="card-body">' +
        itemLinha(c, 'agua', 'Água', 'badge-agua', m.agua_vencimento, bloq) +
        itemLinha(c, 'luz', 'Luz', 'badge-luz', vencDoRelogio(c.relogio), bloq) +
        itemLinha(c, 'outros', 'Outros', 'badge-outros', null, bloq) +
        itemLinha(c, 'aluguel', 'Aluguel', 'badge-aluguel', m.aluguel_vencimento, bloq);

      if (c.obs) h += '<p class="muted small">' + esc(c.obs) + '</p>';
      if (c.wa_enviado_em) h += '<p class="dim small">Mensagem enviada em ' + esc(App.dataBR(String(c.wa_enviado_em).slice(0, 10))) + '</p>';

      if (editando[c.lancamento_id]) h += painelEdicao(c);
      h += '</div>';

      h += '<div class="card-foot m-casa-foot">' +
        '<div class="m-casa-tot">' +
        '<span class="small"><span class="muted">Total </span><b class="money">' + money(c.total_mes) + '</b></span>' +
        '<span class="small"><span class="muted">Pago </span><b class="money money-paid">' + money(c.total_pago) + '</b></span>' +
        '<span class="small"><span class="muted">Em aberto </span><b class="money ' + (Number(c.total_aberto) > 0 ? 'money-open' : 'money-paid') + '">' + money(c.total_aberto) + '</b></span>' +
        (c.quitado_em ? '<span class="badge badge-ok">quitado em ' + esc(App.dataBR(c.quitado_em)) + '</span>' : '') +
        '</div>' +
        '<div class="row">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-acao="editar" data-id="' + c.lancamento_id + '"' + dis(bloq) + '>' +
        (editando[c.lancamento_id] ? 'Fechar edição' : 'Editar valores') + '</button>' +
        (c.tudo_pago
          ? '<button type="button" class="btn btn-outline btn-sm" data-acao="quitar" data-id="' + c.lancamento_id + '" data-pago="0"' + dis(bloq) + '>Desfazer quitação</button>'
          : '<button type="button" class="btn btn-primary btn-sm" data-acao="quitar" data-id="' + c.lancamento_id + '" data-pago="1"' + dis(bloq) + '>Quitar tudo</button>') +
        '</div></div>';

      h += '</article>';
      return h;
    }

    function painelEdicao(c) {
      var id = c.lancamento_id;
      return '<div class="m-edit stack">' +
        '<div class="form-grid">' +
        '<div class="field"><label class="field-label" for="e-outros-' + id + '">Outros (R$)</label>' +
        '<div class="input-money"><input class="input" id="e-outros-' + id + '" type="text" inputmode="decimal" placeholder="0,00" value="' +
        esc(moedaInput(c.outros_valor)) + '"></div></div>' +
        '<div class="field"><label class="field-label" for="e-outros-desc-' + id + '">Descrição de "outros"</label>' +
        '<input class="input" id="e-outros-desc-' + id + '" type="text" maxlength="120" placeholder="ex.: gás, conserto do portão" value="' +
        esc(c.outros_descricao || '') + '"></div>' +
        '<div class="field"><label class="field-label" for="e-aluguel-' + id + '">Aluguel (R$)</label>' +
        '<div class="input-money"><input class="input" id="e-aluguel-' + id + '" type="text" inputmode="decimal" placeholder="0,00" value="' +
        esc(moedaInput(c.aluguel_valor)) + '"></div>' +
        '<span class="field-hint">Padrão da casa: ' + money(c.aluguel_padrao) + '</span></div>' +
        '</div>' +
        '<div class="row">' +
        '<button type="button" class="btn btn-primary btn-sm" data-acao="salvar-lanc" data-id="' + id + '">Salvar valores</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-acao="cancelar-edit" data-id="' + id + '">Cancelar</button>' +
        '</div></div>';
    }

    function vencDoRelogio(relogio) {
      var rs = dados.relogios || [];
      for (var i = 0; i < rs.length; i++) if (rs[i].relogio === relogio) return rs[i].vencimento;
      return null;
    }

    function secCasas(bloq) {
      var casas = dados.casas || [];
      if (!casas.length) {
        return '<div class="empty"><div class="empty-icon">🏠</div>' +
          '<p class="strong">Nenhuma casa neste mês</p>' +
          '<p class="muted small">Cadastre as casas para começar a lançar.</p>' +
          '<p><a class="btn btn-primary" href="/casas">Ir para Casas</a></p></div>';
      }
      var h = '<h2 class="m-tit">Casas</h2><div class="stack">';
      casas.forEach(function (c) { h += cardCasa(c, bloq); });
      return h + '</div>';
    }

    function secAcoes(bloq) {
      var m = dados.mes;
      return '<section class="card">' +
        '<div class="card-head"><div class="card-title">Ações do mês</div></div>' +
        '<div class="card-body m-acoes">' +
        '<a class="btn btn-wa" href="/whatsapp">Gerar mensagens</a>' +
        '<button type="button" class="btn btn-outline" data-acao="fechar-mes" data-fechado="' + (bloq ? '0' : '1') + '">' +
        (bloq ? 'Reabrir mês' : 'Fechar mês') + '</button>' +
        '<button type="button" class="btn btn-danger" data-acao="limpar-mes"' + dis(bloq) + '>Limpar mês</button>' +
        '</div>' +
        '<div class="card-foot"><p class="muted small">Limpar zera contas, vencimentos, "outros" e as marcações de pagamento de ' +
        esc(m.label || '') + '. Inquilinos, moradores e aluguel são mantidos.</p></div>' +
        '</section>';
    }

    // ---------- ações ----------
    async function salvarMes(btn) {
      var body = {
        agua_total: parseMoeda(val('f-agua-total')),
        agua_vencimento: valData('f-agua-venc'),
        aluguel_vencimento: valData('f-aluguel-venc'),
        relogios: (dados.relogios || []).map(function (r) {
          return {
            relogio: r.relogio,
            valor_total: parseMoeda(val('f-luz-valor-' + r.relogio)),
            vencimento: valData('f-luz-venc-' + r.relogio)
          };
        })
      };
      ocupado(btn, true, 'Salvando…');
      try {
        var r = await App.api('/mes/' + dados.mes.id, { method: 'PUT', body: body });
        aplicar(r.mes_completo);
        App.toast('Contas salvas e rateio recalculado', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function marcarPago(id, item, pago, caixa) {
      if (caixa) caixa.disabled = true;
      try {
        var r = await App.api('/lancamento/' + id + '/pago', { method: 'PUT', body: { item: item, pago: !!pago } });
        aplicar(r.mes_completo);
        App.toast(pago ? 'Marcado como pago' : 'Pagamento desmarcado', 'ok');
      } catch (e) {
        if (caixa) { caixa.checked = !pago; caixa.disabled = false; }
      }
    }

    async function salvarLancamento(id, btn) {
      var desc = (val('e-outros-desc-' + id) || '').trim();
      var body = {
        outros_valor: parseMoeda(val('e-outros-' + id)),
        outros_descricao: desc || null,
        aluguel_valor: parseMoeda(val('e-aluguel-' + id))
      };
      ocupado(btn, true, 'Salvando…');
      try {
        var r = await App.api('/lancamento/' + id, { method: 'PUT', body: body });
        delete editando[id];
        aplicar(r.mes_completo);
        App.toast('Valores da casa atualizados', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function limparMes(btn) {
      var ok = await App.confirmar({
        titulo: 'Limpar o mês?',
        texto: 'Zera água, contas de luz, vencimentos, "outros" e todas as marcações de pagamento de ' +
          (dados.mes.label || '') + '. Inquilinos, moradores e aluguel continuam.',
        ok: 'Limpar mês',
        cancelar: 'Cancelar',
        perigo: true
      });
      if (!ok) return;
      ocupado(btn, true, 'Limpando…');
      try {
        var r = await App.api('/mes/' + dados.mes.id + '/limpar', { method: 'POST' });
        editando = {};
        aplicar(r.mes_completo);
        App.toast('Mês limpo', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function fecharMes(fechado, btn) {
      if (fechado) {
        var ok = await App.confirmar({
          titulo: 'Fechar o mês?',
          texto: 'Com o mês fechado nada mais pode ser lançado nem marcado como pago. Dá para reabrir depois.',
          ok: 'Fechar mês',
          cancelar: 'Cancelar'
        });
        if (!ok) return;
      }
      ocupado(btn, true, fechado ? 'Fechando…' : 'Reabrindo…');
      try {
        var r = await App.api('/mes/' + dados.mes.id + '/fechar', { method: 'PUT', body: { fechado: !!fechado } });
        if (fechado) editando = {};
        aplicar(r.mes_completo);
        App.toast(fechado ? 'Mês fechado' : 'Mês reaberto', 'ok');
      } catch (e) {
        ocupado(btn, false);
      }
    }

    async function criarProximo(btn) {
      var p = proximoMes();
      var ok = await App.confirmar({
        titulo: 'Criar ' + App.mesLabel(p.ano, p.mes) + '?',
        texto: 'Um lançamento por casa será criado com os dados atuais de inquilino, moradores e aluguel.',
        ok: 'Criar mês',
        cancelar: 'Cancelar'
      });
      if (!ok) return;
      ocupado(btn, true, '…');
      await carregarMes(p.ano, p.mes);
      App.toast(App.mesLabel(p.ano, p.mes) + ' pronto para lançar', 'ok');
    }

    // ---------- eventos (delegação) ----------
    document.addEventListener('click', function (ev) {
      var alvo = ev.target;
      if (!alvo || !alvo.closest) return;
      var btn = alvo.closest('[data-acao]');
      if (!btn) return;
      var acao = btn.getAttribute('data-acao');
      var id = btn.getAttribute('data-id');

      if (acao === 'ir-mes') {
        ev.preventDefault();
        carregarMes(parseInt(btn.getAttribute('data-ano'), 10), parseInt(btn.getAttribute('data-mes'), 10));
      } else if (acao === 'novo-mes') {
        ev.preventDefault();
        criarProximo(btn);
      } else if (acao === 'recarregar') {
        ev.preventDefault();
        iniciar();
      } else if (acao === 'salvar-mes') {
        ev.preventDefault();
        salvarMes(btn);
      } else if (acao === 'editar') {
        ev.preventDefault();
        if (editando[id]) delete editando[id]; else editando[id] = true;
        render();
      } else if (acao === 'cancelar-edit') {
        ev.preventDefault();
        delete editando[id];
        render();
      } else if (acao === 'salvar-lanc') {
        ev.preventDefault();
        salvarLancamento(id, btn);
      } else if (acao === 'quitar') {
        ev.preventDefault();
        marcarPago(id, 'tudo', btn.getAttribute('data-pago') === '1', null);
      } else if (acao === 'limpar-mes') {
        ev.preventDefault();
        limparMes(btn);
      } else if (acao === 'fechar-mes') {
        ev.preventDefault();
        fecharMes(btn.getAttribute('data-fechado') === '1', btn);
      }
    });

    document.addEventListener('change', function (ev) {
      var alvo = ev.target;
      if (!alvo || !alvo.closest) return;
      var caixa = alvo.closest('.js-pago');
      if (!caixa) return;
      marcarPago(caixa.getAttribute('data-id'), caixa.getAttribute('data-item'), caixa.checked, caixa);
    });

    iniciar();
  })();
  </script>
</body>
</html>
