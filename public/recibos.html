<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Recibos — Controle de Aluguel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/mes-ref.js"></script>
<!-- html2canvas: roda 100% no browser, gera PNG do recibo pra mandar no WhatsApp -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

<header>
  <h1>🏠 Controle de Aluguel</h1>
  <nav>
    <a href="/">📅 Mês atual</a>
    <a href="/recibos" class="active">📄 Recibos</a>
    <a href="/devedores">⚠️ Devedores</a>
    <a href="/historico">📊 Histórico</a>
    <a href="/casas">🏘️ Casas</a>
  </nav>
  <span class="tag-mes-ativo" id="tag-mes-ativo" title="Ir pra Mês atual" onclick="location.href='/?ano='+getMesRef().ano+'&mes='+getMesRef().mes">📅 <span id="tag-mes-ativo-txt">—</span></span>
  <form method="POST" action="/logout" style="margin:0">
    <button type="submit" class="logout-btn">Sair</button>
  </form>
</header>

<main>
  <div class="card card-controls">
    <h2>Recibos do mês</h2>
    <div class="field-inline">
      <div class="field" style="flex:0 0 110px">
        <label>Ano</label>
        <input id="sel-ano" type="number" min="2026" max="2099">
      </div>
      <div class="field" style="flex:0 0 150px">
        <label>Mês</label>
        <select id="sel-mes"></select>
      </div>
      <div class="field" style="flex:0 0 auto">
        <label>&nbsp;</label>
        <button class="primary" onclick="carregar()">📂 Carregar</button>
      </div>
      <div class="field" style="flex:2">
        <label>&nbsp;</label>
        <button class="ghost" onclick="window.print()">🖨️ Imprimir todos</button>
      </div>
    </div>
  </div>

  <div id="grid" class="recibos-grid"></div>
</main>

<script>
function brl(n) {
  return (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
async function api(method, url) {
  const r = await fetch(url, { method });
  if (r.status === 401) { location.href = '/login'; throw new Error('401'); }
  return r.json();
}

const refIni = getMesRef();
const selAno = document.getElementById('sel-ano');
const selMes = document.getElementById('sel-mes');
selAno.value = refIni.ano;
preencherOpcoesMes(selMes, refIni.ano);
selMes.value = refIni.mes;

document.addEventListener('DOMContentLoaded', () => {
  const r = getMesRef();
  const t = document.getElementById('tag-mes-ativo-txt');
  if (t) t.textContent = `${NOMES_MES[r.mes]}/${r.ano}`;
});

selAno.addEventListener('change', () => {
  let ano = parseInt(selAno.value, 10);
  if (!ano || ano < 2026) { ano = 2026; selAno.value = 2026; }
  const mesPrev = parseInt(selMes.value, 10);
  preencherOpcoesMes(selMes, ano);
  const opts = [...selMes.options].map(o => parseInt(o.value, 10));
  selMes.value = opts.includes(mesPrev) ? mesPrev : opts[0];
  carregar();
});
selMes.addEventListener('change', () => carregar());

window._recibos = [];

async function carregar() {
  const ano = parseInt(selAno.value, 10);
  const mes = parseInt(selMes.value, 10);
  if (!ano || !mes) return;
  setMesRef(ano, mes);
  document.getElementById('tag-mes-ativo-txt').textContent = `${NOMES_MES[mes]}/${ano}`;

  const data = await api('GET', `/api/recibos/${ano}/${mes}`);
  if (data && data.error) {
    document.getElementById('grid').innerHTML = `<div class="card">❌ ${escapeHtml(data.error)}</div>`;
    return;
  }
  window._recibos = data.recibos;

  document.getElementById('grid').innerHTML = data.recibos.map((r, i) => {
    if (r.vazia) {
      return `
        <div class="recibo-card" style="opacity:.6">
          <div class="nome">CASA ${r.casa_str} — VAZIA <span class="casa-tag" style="background:#888">vazia</span></div>
          <div class="ref">Sem inquilino em ${escapeHtml(r.ref)}</div>
        </div>
      `;
    }

    const venc = [];
    if (r.vencimento_agua) venc.push(`💧 vence dia ${r.vencimento_agua}`);
    if (r.vencimento_luz)  venc.push(`💡 vence dia ${r.vencimento_luz}`);

    const linhasItens = [];
    if (r.agua > 0) linhasItens.push(`
      <div class="linha agua">
        <div class="ico">💧</div>
        <div class="lbl">ÁGUA</div>
        <div class="val">${brl(r.agua)}</div>
      </div>`);
    if (r.luz > 0) linhasItens.push(`
      <div class="linha luz">
        <div class="ico">💡</div>
        <div class="lbl">LUZ</div>
        <div class="val">${brl(r.luz)}</div>
      </div>`);
    if (r.outros > 0) linhasItens.push(`
      <div class="linha outros">
        <div class="ico">📦</div>
        <div class="lbl">${escapeHtml((r.outros_descricao || 'OUTROS').toUpperCase())}</div>
        <div class="val">${brl(r.outros)}</div>
      </div>`);

    const status = r.tudo_pago
      ? `<div class="status-tag pago">✅ PAGO${r.pago_em ? ' em ' + formatDataBR(r.pago_em) : ''}</div>`
      : `<div class="status-tag devendo">⏳ EM ABERTO</div>`;

    return `
      <div class="recibo-card" id="recibo-${r.casa}">
        <div class="nome">${escapeHtml(r.inquilino || '—')} <span class="casa-tag">CASA ${r.casa_str}</span></div>
        <div class="ref">${escapeHtml(r.ref)}</div>
        ${venc.length ? `<div class="vencimentos">${venc.map(v => `<span>${v}</span>`).join('')}</div>` : ''}
        <div class="linhas">
          ${linhasItens.join('') || '<div class="linha"><div class="ico">—</div><div class="lbl">SEM COBRANÇA</div><div class="val">—</div></div>'}
          <div class="linha total">
            <div class="ico">💰</div>
            <div class="lbl">TOTAL</div>
            <div class="val">${brl(r.total)}</div>
          </div>
        </div>
        ${status}
        <div class="actions">
          <button class="btn-img" onclick="baixarImagem(${r.casa})" title="Baixar como PNG pra mandar foto">🖼️ Imagem</button>
          <button class="btn-wa" onclick="abrirWA(${r.casa})" title="${r.telefone ? 'Abrir conversa com ' + r.telefone : 'Sem telefone — abre wa.me só com a mensagem'}">💬 WhatsApp</button>
        </div>
      </div>
    `;
  }).join('');
}

function formatDataBR(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function abrirWA(casaNum) {
  const r = window._recibos.find(x => x.casa === casaNum);
  if (!r) return;
  const tel = (r.telefone || '').replace(/\D/g, '');
  const telFinal = tel && !tel.startsWith('55') && tel.length >= 10 ? '55' + tel : tel;
  const url = telFinal
    ? `https://wa.me/${telFinal}?text=${encodeURIComponent(r.mensagem_whatsapp)}`
    : `https://wa.me/?text=${encodeURIComponent(r.mensagem_whatsapp)}`;
  window.open(url, '_blank');
}

async function baixarImagem(casaNum) {
  const card = document.getElementById('recibo-' + casaNum);
  if (!card) return;
  const actions = card.querySelector('.actions');
  if (actions) actions.style.visibility = 'hidden';
  try {
    const canvas = await html2canvas(card, {
      backgroundColor: '#ffffff',
      scale: 2,
      logging: false,
    });
    const r = window._recibos.find(x => x.casa === casaNum);
    const nome = (r?.inquilino || 'casa').replace(/[^a-zA-Z0-9]/g, '_');
    const ref = (r?.ref || '').replace('/', '_');
    const link = document.createElement('a');
    link.download = `recibo_casa${r?.casa_str || casaNum}_${nome}_${ref}.png`;
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (e) {
    alert('Erro ao gerar imagem: ' + e.message);
  } finally {
    if (actions) actions.style.visibility = '';
  }
}

carregar();
</script>

</body>
</html>
