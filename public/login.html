<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<script>/* tema antes da pintura, evita piscar */(function(){try{var t=localStorage.getItem('quintal.tema');if(t!=='claro'&&t!=='escuro'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'claro':'escuro';}document.documentElement.setAttribute('data-theme',t==='claro'?'light':'dark');if(t==='claro'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#ffffff');}}catch(e){}})();</script>
<meta name="robots" content="noindex,nofollow">
<title>Quintal — Entrar</title>
<link rel="stylesheet" href="/css/app.css?v=3.11">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<div class="login-wrap">
  <main class="login-card">
    <div class="login-logo" aria-hidden="true">🏡</div>
    <h1>Quintal</h1>
    <p class="login-sub">Controle das casas de aluguel</p>

    <div id="erro-box" class="login-erro" role="alert" style="display:none">Senha incorreta. Tente novamente.</div>

    <form id="loginForm" method="POST" action="/login" autocomplete="on" class="stack">
      <div class="field">
        <label class="field-label" for="senha">Senha</label>
        <input class="input" id="senha" name="senha" type="password" autofocus required autocomplete="current-password" placeholder="Sua senha">
      </div>
      <label class="switch" style="margin:2px 0 6px">
        <input type="checkbox" name="lembrar" value="1" checked>
        <span>Lembrar deste dispositivo</span>
      </label>
      <div class="turnstile-box">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADnXl9wSTvsZZq8n" data-theme="auto"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Entrar</button>
    </form>

    <form id="twofaForm" method="POST" action="/login/verify-2fa" autocomplete="off" class="stack" style="display:none">
      <p class="login-sub" style="margin-bottom:4px">Enviamos um código de 6 dígitos para o seu e-mail. Digite-o abaixo para entrar.</p>
      <div class="field">
        <label class="field-label" for="codigo">Código de acesso</label>
        <input class="input codigo-input" id="codigo" name="codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000">
        <span class="field-hint">O código vale por poucos minutos. Depois de confirmar,
          este aparelho não pede mais o código.</span>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Verificar e entrar</button>
    </form>

    <p class="login-foot">Acesso restrito ao responsável</p>
  </main>
</div>
<script>
  var _params = new URLSearchParams(location.search);
  if (_params.get('step') === '2fa') {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('twofaForm').style.display = 'flex';
    var _c = document.getElementById('codigo'); if (_c) _c.focus();
  }
  var _erro = _params.get('erro');
  if (_erro) {
    var _box = document.getElementById('erro-box');
    var _msgs = {
      captcha: 'Verificação anti-bot falhou. Recarregue e tente de novo.',
      bloqueado: 'Muitas tentativas. Aguarde alguns minutos.',
      codigo: 'Código inválido. Tente de novo.',
      expirou: 'Código expirado. Faça login novamente.',
      tentativas: 'Muitas tentativas. Faça login novamente.',
      email: 'Falha ao enviar o código por e-mail. Tente novamente.',
      '1': 'Senha incorreta. Tente novamente.'
    };
    _box.textContent = _msgs[_erro] || 'Erro. Tente novamente.';
    _box.style.display = 'flex';
  }
</script>
</body>
</html>
